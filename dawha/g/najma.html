<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>نجمة القدرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a calm pastel sky with tiny stars — the question fills the stage, the live scoreboard stands at its side, the star is crowned at the end */
:root{
  --night:#FAF8FE;      /* inner surfaces */
  --deep:rgba(255,255,255,.9); /* panels */
  --gold-text:#9A6A06;  /* gold for text on light */
  --shadow:0 10px 30px rgba(84,64,150,.09);
  --line:#E3DAF6;       /* hairlines, empty ring */
  --ink:#2E2456;        /* main text */
  --mist:#776E9B;       /* secondary text */
  --gold:#EDB43F;       /* the star, accents */
  --gold-ink:#3A2700;   /* text on gold */
  --right:#3BAA8C;      /* correct */
  --wrong:#DE5469;      /* time running out */
  --f-display:"B Arabic Style","BArabicStyle","B_Arabic_Style","Alhurra","AlHurra","Al-Hurra","Alhurra Txtreg","Alhurra Txtreg Bold","Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:#F5F0FB;
  background-image:linear-gradient(180deg,#EFE8FB 0%,#F8F5FD 55%,#FDFBF6 100%);background-attachment:fixed;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:20px}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap>*{position:relative;z-index:1}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:84px;height:84px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,7vw,4.6rem);margin:0;line-height:1.1;color:var(--gold-text)}
.brand small{display:block;color:var(--mist);font-size:1rem;margin-top:4px;font-family:var(--f-body);font-weight:400}
.tools{display:flex;gap:8px}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--mist);border-radius:10px;
  padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:var(--mist)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* buttons */
.btn{font-family:var(--f-display);font-size:1.15rem;font-weight:700;border:0;border-radius:14px;
  padding:12px 26px;cursor:pointer;background:var(--gold);color:var(--gold-ink);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* setup */
.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.names{grid-template-columns:1fr}}
.setup .intro h2{font-family:var(--f-display);font-size:clamp(2.4rem,6vw,4rem);line-height:1.25;margin:8px 0 12px;text-wrap:balance}
.setup .intro p{color:var(--mist);max-width:46ch;margin:0 0 10px}
.rules{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:baseline;color:var(--ink)}
.rules li::before{content:"★";color:var(--gold-text);font-size:.85rem}
.form{background:var(--deep);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.form h3{margin:0 0 4px;font-family:var(--f-display);font-size:1.2rem}
.field{display:flex;align-items:center;gap:10px}
.field .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-weight:700;flex:none;font-size:.9rem}
.field input,.field select{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.hint{color:var(--mist);font-size:.85rem}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{background:var(--deep);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:14px}
.qmeta{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--gold-text);font-weight:700}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:320px}
.dots i{width:12px;height:6px;border-radius:3px;background:var(--line)}
.dg{font-family:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:700}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--f-body);font-weight:700;font-size:.92em;line-height:1.25;margin:0 .3em;white-space:nowrap}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em .1em}
.frac>span:last-child{padding-top:.1em}
.rad{display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;margin:0 .2em}
.rad svg{width:.75em;flex:none;align-self:stretch;height:auto;overflow:visible}
.rad path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt{display:inline-flex;align-items:center;border-top:2.5px solid currentColor;padding:.25em .25em .1em}
.rt .frac{margin:0}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--ink)}
.timer{position:relative;width:86px;height:86px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .bg{stroke:var(--line)}
.timer .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear, stroke .3s}
.timer.low .fg{stroke:var(--wrong)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.timer.low b{color:var(--wrong);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.qtype{display:inline-block;align-self:flex-start;font-size:.8rem;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.qtext{font-family:var(--f-display);font-weight:500;font-size:clamp(2.4rem,6.5vw,6.3rem);line-height:1.45;margin:0;text-wrap:balance}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare div{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center}
.compare div>span{display:block;font-size:.8rem;color:var(--mist);margin-bottom:6px}
.compare strong{display:inline-flex;align-items:center;justify-content:center}
.compare strong{font-family:var(--f-display);font-size:1.4rem;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;background:var(--night);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.25rem;transition:all .3s;min-width:0}
.opt .l{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--line);color:var(--ink);font-family:var(--f-display);font-weight:700;flex:none}
.opt.correct{border-color:var(--right);background:color-mix(in srgb,var(--right) 16%,var(--night))}
.opt.correct .l{background:var(--right);color:#fff}
.opt.dim{opacity:.38}
.reveal{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:16px}
.why{margin:0;color:var(--mist)}
.why b{color:var(--right)}
.who{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--right);border-color:var(--right);color:#fff;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* scoreboard */
.board{background:var(--deep);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:22px;padding:18px}
.board h3{margin:0 0 12px;font-family:var(--f-display);font-size:1.15rem;display:flex;justify-content:space-between}
.board h3 span{color:var(--mist);font-family:var(--f-body);font-size:.8rem;font-weight:400}
.rows{position:relative}
.prow{position:absolute;inset-inline:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;
  background:var(--night);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.prow .rk{width:26px;font-family:var(--f-display);color:var(--mist);font-variant-numeric:tabular-nums}
.prow.first .rk{color:var(--gold-text)}
.prow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pt{font-family:var(--f-display);font-size:1.25rem;color:var(--gold-text);font-variant-numeric:tabular-nums}
.prow.bump{animation:bump .8s}
@keyframes bump{30%{background:color-mix(in srgb,var(--right) 30%,var(--night))}}

/* final */
.final{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.final .eyebrow{font-size:.95rem}
.crown{width:120px;height:120px;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--gold) 60%,transparent))}
.winner{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,6vw,3.8rem);color:var(--gold-text);margin:0;line-height:1.2;text-wrap:balance}
.final p{color:var(--mist);margin:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:560px;margin-top:8px}
.step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.step .who{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step .blk{width:100%;border-radius:12px 12px 0 0;background:var(--deep);border:1px solid var(--line);border-bottom:0;
  display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;color:var(--mist)}
.step.p1 .blk{height:150px;background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.step.p2 .blk{height:110px}
.step.p3 .blk{height:80px}
.step small{color:var(--mist);font-variant-numeric:tabular-nums}
.rest{list-style:none;padding:0;margin:0;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--mist)}

footer{color:var(--mist);font-size:.8rem;text-align:center;opacity:.8}

@media (max-width:820px){
  .setup,.stage{grid-template-columns:1fr}
  .opts,.compare{grid-template-columns:1fr}
  .qcard{padding:18px}
  .timer{width:70px;height:70px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2C14E" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
      <div><h1>نجمة القدرات</h1><small>النهائي الإلكتروني · الصف الثالث الثانوي</small></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">الصوت: يعمل</button>
      <button class="icon-btn" id="fsBtn" type="button">ملء الشاشة</button>
    </div>
  </header>

  <main id="app"></main>

  <footer>إعداد المعلمتين: عهود جويهر - هند العديني</footer>
</div>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

/* ======= الأسئلة: عدّليها من هنا ======= */
const F = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const RT = x => `<span class="rad" dir="ltr"><svg viewBox="0 0 16 40" preserveAspectRatio="none" aria-hidden="true"><path d="M1 25 L5 22 L9 39 L16 1"/></svg><span class="rt">${x}</span></span>`;
const CMP = ["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"];
const QUESTIONS = [
  { type:"قيمة منزلية", text:"ما عدد المئات في العدد ٧٩٦٣٥؟",
    options:["٧٩٦","٩٦","٦٣","٦"], answer:0,
    why:"عدد المئات = ٧٩٦٣٥ ÷ ١٠٠ بإهمال الباقي = ٧٩٦ (والرقم في خانة المئات وحده هو ٦)" },
  { type:"كسور", text:`ما العدد الذي سُدسه يساوي ${F("٢٥","٣")}؟`,
    options:["٣٠","٤٠","٥٠","٦٠"], answer:2,
    why:`العدد = ٦ × ${F("٢٥","٣")} = ٢ × ٢٥ = ٥٠` },
  { type:"هندسة", text:"سلك صُنع منه مربع طول ضلعه ٩ سم، ثم أُعيد تشكيله مثلثًا متطابق الأضلاع. ما طول ضلع المثلث؟",
    options:["٢ سم","٦ سم","١٢ سم","١٨ سم"], answer:2,
    why:"طول السلك = محيط المربع = ٤ × ٩ = ٣٦ سم، وضلع المثلث = ٣٦ ÷ ٣ = ١٢ سم" },
  { type:"نسبة وتناسب", text:`إذا كانت نسبة استهلاك الماء إلى الكهرباء = ${F("١","٢٠")}، وكان استهلاك الماء ٢٠، فكم استهلاك الكهرباء؟`,
    options:["٢٠","٤٠","٢٠٠","٤٠٠"], answer:3,
    why:"الكهرباء = ٢٠ × ٢٠ = ٤٠٠" },
  { type:"مقارنة", text:"قارني بين القيمتين:",
    compare:[RT(F("٢٥","١٠٠")), F("١","٢")], options:CMP, answer:2,
    why:`${RT(F("٢٥","١٠٠"))} = ${F("٥","١٠")} = ${F("١","٢")}، فالقيمتان متساويتان` },
  { type:"هندسة", text:"مثلث قائم الزاوية، قياس زاويتيه الحادتين س° و ٤س°. ما قيمة س؟",
    options:["١٨","٣٦","٤٥","٦٠"], answer:0,
    why:"مجموع الحادتين ٩٠°، إذن ٥س = ٩٠ ومنها س = ١٨" },
  { type:"إحصاء", text:"مع حنان ٥ بطاقات عليها خمسة أعداد متوسطها ٨٥، ومجموع أربعة منها ٣٢٠. ما العدد على البطاقة الخامسة؟",
    options:["٧٥","٩٥","١٠٥","١١٠"], answer:2,
    why:"مجموع الخمسة = ٥ × ٨٥ = ٤٢٥، والخامس = ٤٢٥ − ٣٢٠ = ١٠٥" },
  { type:"جبر", text:`إذا كان <span style="white-space:nowrap">${F("٤ × ٧","١٠٠")} = ${F("٧","س")}</span>، فما قيمة س؟`,
    options:["٠٫٠٤","٢٥","٤٠","٤٠٠"], answer:1,
    why:`${F("٢٨","١٠٠")} = ${F("٧","س")}، وبالضرب التبادلي ٢٨س = ٧٠٠، إذن س = ٢٥` },
  { type:"أعداد", text:"إذا كان س عددًا فرديًا، فأي مما يلي يجب أن يكون زوجيًا؟",
    options:["٢س + ١","س + ٦","٣س","٤س + ٦"], answer:3,
    why:"٤س زوجي دائمًا و٦ زوجي، فمجموعهما زوجي. أما البقية فكلها فردية" },
  { type:"مقارنة", text:"إذا كان <span style=\"white-space:nowrap\">س × ص = ١٠</span>، قارني بين القيمتين:",
    compare:["س","٠٫٠٠٠١"], options:CMP, answer:3,
    why:"س قد تكون ١٠ وص = ١، أو س = ٠٫٠٠٠٠١ وص كبيرة جدًا، فلا يمكن الحكم" },
  { type:"ربح وخسارة", text:"اشترى بقّال ١٨٠ برتقالة بـ ١٠٠ ريال، وجد منها ٢٠ تالفة، وباع كل ٨ حبات بـ ٨٫٥ ريال. كم ربحه؟",
    options:["٦٠ ريالًا","٦٢٫٥ ريالًا","٧٠ ريالًا","٩١٫٢٥ ريالًا"], answer:2,
    why:"الصالح ١٦٠ برتقالة = ٢٠ مجموعة × ٨٫٥ = ١٧٠ ريالًا، والربح = ١٧٠ − ١٠٠ = ٧٠" },
  { type:"مقارنة", text:"قارني بين القيمتين:",
    compare:["عدد الدقائق من ٩:١٢ مساءً إلى ٩:٠٢ مساء اليوم التالي","١٤٩٠ دقيقة"], options:CMP, answer:1,
    why:"المدة يوم كامل إلا ١٠ دقائق = ١٤٤٠ − ١٠ = ١٤٣٠ دقيقة، وهي أقل من ١٤٩٠" },
  { type:"مسائل لفظية", text:"٦٣ وردة وُزّعت على ١١ باقة، بعضها فيها ٥ وردات والباقي فيها ٧ وردات. كم باقة فيها ٧ وردات؟",
    options:["٣","٤","٦","٧"], answer:1,
    why:"لو كانت كل الباقات ٥ وردات لكان المجموع ٥٥، والفرق ٨ وردات، وكل باقة السبع تزيد ٢، إذن ٨ ÷ ٢ = ٤ باقات" },
  { type:"هندسة", text:"رُسم مربع على كل ضلع من أضلاع مثلث متطابق الأضلاع (من الخارج). ما قياس الزاوية س المحصورة بين مربعين عند أحد رؤوس المثلث؟",
    options:["٦٠°","١٢٠°","١٥٠°","١٨٠°"], answer:1,
    why:"مجموع الزوايا حول النقطة ٣٦٠°، إذن س = ٣٦٠ − ٩٠ − ٩٠ − ٦٠ = ١٢٠°" },
  { type:"كسور", text:"اشترت امرأة ٣ عطور: ثمن الثاني نصف ثمن الأول، وثمن الثالث ربع ثمن الثاني، ودفعت ١٣٠٠ ريال. ما ثمن العطر الأول؟",
    options:["٢٠٠ ريال","٣٠٠ ريال","٤٠٠ ريال","٨٠٠ ريال"], answer:3,
    why:`الأول س، والثاني ${F("س","٢")}، والثالث ${F("س","٨")}، فالمجموع ${F("١٣س","٨")} = ١٣٠٠ ومنها س = ٨٠٠` },
  { type:"جبر", text:`إذا كان <span style="white-space:nowrap">٦ ≤ ص ≤ ١٢٩٦</span>، و <span style="white-space:nowrap">٢٤ ≤ س ≤ ٣٦</span>، فما أكبر قيمة للمقدار ${F("ص","س")}؟`,
    options:["٢٧","٣٦","٤٥","٥٤"], answer:3,
    why:`أكبر قيمة تكون بأكبر بسط وأصغر مقام: ${F("١٢٩٦","٢٤")} = ٥٤` },
  { type:"مقارنة", text:"إذا كان ٢٠٪ من ربع <span style=\"white-space:nowrap\">(س − ١) = ٢</span>، قارني بين القيمتين:",
    compare:["س","١٤"], options:CMP, answer:0,
    why:`${F("١","٥")} × ${F("س − ١","٤")} = ٢، إذن س − ١ = ٤٠ ومنها س = ٤١ > ١٤` },
  { type:"مقارنة", text:"دائرة قُسمت إلى جزأين: زاوية الجزء غير المظلل ٣٦°، ومساحة الجزء المظلل ٩٠ط. قارني بين القيمتين:",
    compare:["مساحة الجزء غير المظلل","٩ط"], options:CMP, answer:0,
    why:"المظلل زاويته ٣٢٤° أي ٩ أعشار الدائرة، فمساحة الدائرة ١٠٠ط، وغير المظلل = ١٠ط > ٩ط" },
  { type:"أعداد", text:"ما الرقم في خانة العشرات في ناتج ضرب ٥٤٣٢١ × ١٢٣٤٥؟",
    options:["٥","٤","٣","٢"], answer:1,
    why:"يكفي ضرب آخر رقمين: ٢١ × ٤٥ = ٩٤٥، فرقم العشرات ٤" },
  { type:"جبر", text:`إذا كان ${F("٢","أ")} + ${F("٣","ل")} = ${F("٥","١٢")}، وكان أ × ل = ٢٤، فما قيمة ٦أ + ٤ل؟`,
    options:["٥","١٢","١٠","٢٠"], answer:3,
    why:`بتوحيد المقامات: ${F("٢ل + ٣أ","٢٤")} = ${F("٥","١٢")}، إذن ٣أ + ٢ل = ١٠، والمطلوب ضعفه = ٢٠` }
];
const POINTS = 10;
const LETTERS = ["أ","ب","ج","د"];
/* ======================================= */

const ar = v => String(v).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");

const S = { players:[], q:0, seconds:90, left:90, tick:null, revealed:false, picked:new Set(), sound:true };

/* ---------- sound ---------- */
let actx = null;
function tone(freq, dur=.15, when=0, type="sine", vol=.18){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx = {
  tick(){ tone(880,.08,0,"square",.06) },
  reveal(){ tone(523,.18); tone(659,.18,.12); tone(784,.3,.24) },
  point(){ tone(988,.12,0,"triangle"); tone(1319,.2,.08,"triangle") },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,i*.16,"triangle",.2)) }
};

/* ---------- starry background + confetti ---------- */
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let stars = [], bits = [];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeSky(){
  cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=["#EDB43F","#F3CD78","#EDB43F","#C9B9F0"];
  stars = Array.from({length:Math.round(innerWidth*innerHeight/7000)},(_,i)=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*2.6+1.6, p:Math.random()*6.28,
    c:cols[i%cols.length], star:Math.random()<.65, rot:Math.random()*6.28 }));
}
function starPath(x,y,r){
  cx.beginPath();
  for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr) }
  cx.closePath();
}
function frame(t){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    cx.globalAlpha = reduce ? .7 : .45+.4*Math.sin(t/1100+s.p);
    cx.fillStyle=s.c;
    if(s.star){ cx.save(); cx.translate(s.x,s.y); cx.rotate(s.rot); starPath(0,0,s.r*1.6); cx.fill(); cx.restore(); }
    else { cx.beginPath(); cx.arc(s.x,s.y,s.r*.45,0,6.28); cx.fill(); }
  }
  cx.globalAlpha=1;
  bits = bits.filter(b=>b.y<innerHeight+30);
  for(const b of bits){
    b.vy+=.06; b.x+=b.vx; b.y+=b.vy; b.rot+=b.vr;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot); cx.fillStyle=b.c;
    if(b.star) starPath(0,0,b.s); else { cx.beginPath(); cx.rect(-b.s/2,-b.s/4,b.s,b.s/2) }
    cx.fill(); cx.restore();
  }
  requestAnimationFrame(frame);
}
function confetti(n=180){
  if(reduce) return;
  const cols=["#EDB43F","#F3CD78","#C9B9F0","#9F8BDB"];
  for(let i=0;i<n;i++) bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,
    vx:(Math.random()-.5)*12,vy:-Math.random()*9-3,s:Math.random()*9+6,rot:Math.random()*6,
    vr:(Math.random()-.5)*.3,c:cols[i%cols.length],star:Math.random()<.4});
}
addEventListener("resize",sizeSky); sizeSky(); requestAnimationFrame(frame);

/* ---------- screens ---------- */
function setup(){
  stopTimer();
  const names = Array.from({length:10},(_,i)=>S.players[i]?.name||"");
  app.innerHTML = `
  <section class="setup">
    <div class="intro">
      <span class="eyebrow">الجولة النهائية</span>
      <h2>من ستكون نجمة القدرات هذا العام؟</h2>
      <p>تأهلت الأوائل من الاختبار الورقي، والآن يُحسم اللقب على الشاشة أمام الجميع.</p>
      <ul class="rules">
        <li>${ar(QUESTIONS.length)} أسئلة كمية بأسلوب اختبار القدرات</li>
        <li>لكل سؤال وقت محدد يظهر في العدّاد</li>
        <li>تكتب المتسابقات الإجابة على السبورة الصغيرة ويرفعنها عند انتهاء الوقت</li>
        <li>كل إجابة صحيحة = ${ar(POINTS)} نقاط، والأعلى نقاطًا تُتوَّج نجمةً</li>
      </ul>
    </div>
    <form class="form" id="f">
      <h3>المتسابقات</h3>
      <div class="names">${names.map((n,i)=>`
        <div class="field"><span class="num">${ar(i+1)}</span>
        <input id="p${i}" value="${esc(n)}" placeholder="اسم المتسابقة ${ar(i+1)}" aria-label="اسم المتسابقة ${i+1}"></div>`).join("")}</div>
      <div class="field"><span class="num">⏱</span>
        <select id="sec" aria-label="وقت كل سؤال">
          ${[30,45,60,90].map(s=>`<option value="${s}" ${s===S.seconds?"selected":""}>${ar(s)} ثانية لكل سؤال</option>`).join("")}
        </select></div>
      <div class="row-end">
        <span class="hint">الخانات الفارغة تُترك خارج المسابقة</span>
        <button class="btn" type="submit">ابدئي النهائي</button>
      </div>
    </form>
  </section>`;
  document.getElementById("f").addEventListener("submit", e=>{
    e.preventDefault();
    const list = names.map((_,i)=>document.getElementById("p"+i).value.trim())
      .map((n,i)=>n||(i<3?`المتسابقة ${ar(i+1)}`:"")).filter(Boolean);
    S.players = list.map((name,id)=>({id,name,score:0}));
    S.seconds = +document.getElementById("sec").value;
    S.q = 0; tone(660,.15);
    question();
  });
}

function question(){
  const q = QUESTIONS[S.q];
  S.revealed=false; S.picked=new Set(); S.left=S.seconds;
  app.innerHTML = `
  <section class="stage">
    <article class="qcard">
      <div class="qhead">
        <div class="qmeta">
          <span class="eyebrow">السؤال ${ar(S.q+1)} من ${ar(QUESTIONS.length)}</span>
          <div class="dots">${QUESTIONS.map((_,i)=>`<i class="${i<S.q?"done":i===S.q?"now":""}"></i>`).join("")}</div>
        </div>
        <div class="timer" id="timer" role="timer" aria-live="off">
          <svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" id="ring" cx="40" cy="40" r="34"/></svg>
          <b id="tnum">${ar(S.left)}</b>
        </div>
      </div>
      <span class="qtype">${q.type}</span>
      <h2 class="qtext">${q.text}</h2>
      ${q.compare?`<div class="compare"><div><span>القيمة الأولى</span><strong>${q.compare[0]}</strong></div><div><span>القيمة الثانية</span><strong>${q.compare[1]}</strong></div></div>`:""}
      <div class="opts">${q.options.map((o,i)=>`<div class="opt" id="o${i}"><span class="l">${LETTERS[i]}</span><span>${o}</span></div>`).join("")}</div>
      <div id="after" class="actions"><button class="btn" id="revealBtn" type="button">إظهار الإجابة</button></div>
    </article>
    ${boardHTML()}
  </section>`;
  placeRows();
  document.getElementById("revealBtn").onclick = reveal;
  startTimer();
}

function reveal(){
  if(S.revealed) return;
  S.revealed = true; stopTimer(); sfx.reveal();
  const q = QUESTIONS[S.q];
  q.options.forEach((_,i)=>document.getElementById("o"+i).classList.add(i===q.answer?"correct":"dim"));
  const last = S.q===QUESTIONS.length-1;
  document.getElementById("after").outerHTML = `
    <div class="reveal">
      <p class="why"><b>الإجابة: ${LETTERS[q.answer]}</b> · ${q.why}</p>
      <span class="who">من أجابت إجابة صحيحة؟</span>
      <div class="chips">${S.players.map(p=>`<button class="chip" type="button" data-id="${p.id}" aria-pressed="false">${esc(p.name)}</button>`).join("")}</div>
      <div class="actions"><button class="btn" id="nextBtn" type="button">${last?"تتويج النجمة":"السؤال التالي"}</button></div>
    </div>`;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const id=+c.dataset.id, p=S.players.find(x=>x.id===id), on=!S.picked.has(id);
    on?S.picked.add(id):S.picked.delete(id);
    p.score += on?POINTS:-POINTS;
    c.setAttribute("aria-pressed",on);
    if(on) sfx.point();
    updateBoard(on?id:null);
  });
  document.getElementById("nextBtn").onclick=()=>{
    if(last) finale(); else { S.q++; question(); }
  };
}

function ranked(){ return [...S.players].sort((a,b)=>b.score-a.score || a.id-b.id) }

function boardHTML(){
  return `<aside class="board"><h3>لوحة النقاط <span>تتحدث مباشرة</span></h3>
    <div class="rows" id="rows" style="height:${S.players.length*52-6}px">
    ${S.players.map(p=>`<div class="prow" id="r${p.id}"><span class="rk"></span><span class="nm">${esc(p.name)}</span><span class="pt"></span></div>`).join("")}
    </div></aside>`;
}
function placeRows(bumpId){
  const r = ranked(), top = r[0]?.score;
  r.forEach((p,i)=>{
    const el=document.getElementById("r"+p.id); if(!el) return;
    el.style.transform=`translateY(${i*52}px)`;
    el.querySelector(".rk").textContent = ar(i+1);
    el.querySelector(".pt").textContent = ar(p.score);
    el.classList.toggle("first", p.score>0 && p.score===top);
    if(p.id===bumpId){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump") }
  });
}
const updateBoard = id => placeRows(id);

function finale(){
  stopTimer();
  const r = ranked(), best = r[0].score, stars = r.filter(p=>p.score===best);
  const names = stars.map(p=>esc(p.name)).join(" و ");
  const pod = [r[1],r[0],r[2]];
  app.innerHTML = `
  <section class="final">
    <svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2C14E" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
    <span class="eyebrow">${stars.length>1?"نجمات القدرات لهذا العام":"نجمة القدرات لهذا العام"}</span>
    <h2 class="winner">${names}</h2>
    <p>${ar(best)} نقطة من ${ar(QUESTIONS.length*POINTS)}${stars.length>1?" · تعادل على القمة":""}</p>
    <div class="podium">
      ${pod.map((p,i)=>p?`<div class="step p${[2,1,3][i]}"><span class="who">${esc(p.name)}</span><small>${ar(p.score)} نقطة</small><div class="blk">${ar([2,1,3][i])}</div></div>`:"").join("")}
    </div>
    ${r.length>3?`<ul class="rest">${r.slice(3).map((p,i)=>`<li>${ar(i+4)}. ${esc(p.name)} · ${ar(p.score)}</li>`).join("")}</ul>`:""}
    <p>مبارك لجميع المتأهلات، فالوصول إلى النهائي إنجاز بحد ذاته.</p>
    <div class="actions" style="justify-content:center">
      <button class="btn ghost" id="again" type="button">مسابقة جديدة</button>
      <button class="btn" id="party" type="button">احتفال مرة أخرى</button>
    </div>
  </section>`;
  sfx.fanfare(); confetti(); setTimeout(()=>confetti(120),900);
  document.getElementById("again").onclick=()=>{ S.players.forEach(p=>p.score=0); setup() };
  document.getElementById("party").onclick=()=>{ sfx.fanfare(); confetti() };
}

/* ---------- timer ---------- */
const CIRC = 2*Math.PI*34;
function drawTimer(){
  const ring=document.getElementById("ring"), num=document.getElementById("tnum"), box=document.getElementById("timer");
  if(!ring) return;
  ring.style.strokeDasharray=CIRC;
  ring.style.strokeDashoffset=CIRC*(1-S.left/S.seconds);
  num.textContent=ar(S.left);
  box.classList.toggle("low", S.left<=5);
}
function startTimer(){
  stopTimer(); drawTimer();
  S.tick=setInterval(()=>{
    S.left--; drawTimer();
    if(S.left<=5 && S.left>0) sfx.tick();
    if(S.left<=0){ stopTimer(); reveal(); }
  },1000);
}
function stopTimer(){ clearInterval(S.tick); S.tick=null }

/* ---------- tools ---------- */
const sb=document.getElementById("soundBtn");
sb.onclick=()=>{ S.sound=!S.sound; sb.textContent="الصوت: "+(S.sound?"يعمل":"مكتوم"); sb.setAttribute("aria-pressed",S.sound) };
document.getElementById("fsBtn").onclick=()=>{
  try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}) }catch(e){}
};
addEventListener("keydown",e=>{
  if(e.target.matches("input,select")) return;
  if(e.code==="Space" && document.getElementById("revealBtn")){ e.preventDefault(); reveal() }
});

/* digits in a clean font (smooth ٢ without teeth) */
const DIG = /[٠-٩]+(?:[٫٬.,][٠-٩]+)*/g;
function wrapDigits(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n =>
    /[٠-٩]/.test(n.nodeValue) && !n.parentElement.closest(".dg,input,select,option,textarea") ? 1 : 2 });
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  for(const n of list){
    DIG.lastIndex=0;
    const f=document.createDocumentFragment(); let last=0, m; const s=n.nodeValue;
    while((m=DIG.exec(s))){ if(m.index>last) f.append(s.slice(last,m.index)); const sp=document.createElement("span"); sp.className="dg"; sp.textContent=m[0]; f.append(sp); last=m.index+m[0].length; }
    if(last<s.length) f.append(s.slice(last));
    n.replaceWith(f);
  }
  DIG.lastIndex=0;
}
const mo = new MutationObserver(()=>{ mo.disconnect(); wrapDigits(document.querySelector(".wrap")); mo.observe(document.querySelector(".wrap"),{childList:true,subtree:true,characterData:true}); });
mo.observe(document.querySelector(".wrap"),{childList:true,subtree:true,characterData:true});

setup();
</script>

</body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>رفيق الحصة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#7c5cc4">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --purple:#7c5cc4; --purple-d:#5b3fa0; --lav:#efe9f9; --beige:#f7f2e8;
  --green:#4f9a6c; --green-l:#e3f2e8; --ink:#2e2640; --muted:#7a7290;
  --red:#cf5a52; --gold:#e5ad22; --card:#fff; --line:#e3dcef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--beige);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;font-size:clamp(12px,2.3vmin,22px);user-select:none;-webkit-user-select:none}
h1,h2,h3,.cal{font-family:Calibri,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:.6em;padding:.45em .9em;background:var(--lav);color:var(--purple-d);font-weight:600;transition:transform .08s,background .2s}
button:active{transform:scale(.96)}
button.primary{background:var(--purple);color:#fff}
button.green{background:var(--green);color:#fff}
button.ghost{background:transparent;color:inherit}
button.danger{background:#fbe6e4;color:var(--red)}

header{display:flex;align-items:center;gap:.5em;padding:.45em .7em;background:var(--purple);color:#fff;flex-wrap:wrap}
header h1{font-size:1.15em;font-weight:700;white-space:nowrap}
header select{font:inherit;border:0;border-radius:.5em;padding:.25em .5em;background:#fff;color:var(--ink);max-width:12em}
.tabs{display:flex;gap:.3em;margin-inline-start:auto;flex-wrap:wrap}
@media (max-width:480px){body{font-size:14px}.tabs{order:9;width:100%;margin:0}.tabs button{flex:1;padding:.4em .3em}.grid{grid-template-columns:repeat(auto-fill,minmax(7em,1fr))}.pickName{font-size:2.2em}}
.tabs button{background:rgba(255,255,255,.16);color:#fff;padding:.4em .8em}
.tabs button.on{background:#fff;color:var(--purple-d)}
.hbtn{background:rgba(255,255,255,.16);color:#fff;padding:.4em .6em}
.badge{background:var(--gold);color:#3b2a00;border-radius:2em;padding:.15em .6em;font-weight:700;font-variant-numeric:tabular-nums;display:none}
.badge.show{display:inline-block}

main{flex:1;overflow:auto;padding:.7em}
footer{text-align:center;font-size:.72em;color:var(--muted);padding:.25em}

.toolbar{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin-bottom:.6em}
.toolbar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:.55em}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:.9em;padding:.6em .5em .5em;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--purple);box-shadow:0 .3em .8em rgba(124,92,196,.15)}
.card:active{transform:scale(.97)}
.card .nm{font-family:Calibri,"Segoe UI",sans-serif;font-weight:700;font-size:1.05em;line-height:1.25;min-height:1.3em;word-break:break-word}
.card .pt{font-size:1.5em;font-weight:800;color:var(--gold);margin-top:.15em;font-variant-numeric:tabular-nums}
.card .crown{position:absolute;top:-.55em;inset-inline-start:.4em;font-size:1.2em}
.card .minus{position:absolute;bottom:.3em;inset-inline-end:.3em;width:1.6em;height:1.6em;padding:0;border-radius:50%;background:var(--lav);color:var(--muted);font-size:.85em;opacity:.55}
.card .minus:hover{opacity:1}
.card.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.1);border-color:var(--gold)}}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;color:var(--muted)}
.empty .big{font-size:3em}

/* picker */
.pick{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;text-align:center}
.pickName{font-family:Calibri,"Segoe UI",sans-serif;font-size:3.4em;font-weight:800;color:var(--purple-d);min-height:1.3em;line-height:1.2;padding:.2em .6em;border-radius:.4em;background:#fff;border:3px dashed var(--line);min-width:60%}
.pickName.done{border:3px solid var(--green);background:var(--green-l);color:var(--green);animation:pop .5s}
.pickName.rolling{color:var(--muted)}
.row{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;align-items:center}
.muted{color:var(--muted);font-size:.9em}
label.chk{display:inline-flex;gap:.35em;align-items:center;cursor:pointer;color:var(--muted);font-size:.9em}

/* timer */
.timer{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em}
.ring{position:relative;width:min(48vmin,60vh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--lav)}
.ring .fg{stroke:var(--green);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring .fg.warn{stroke:var(--red)}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,10vmin,110px);font-weight:800;font-variant-numeric:tabular-nums;font-family:Calibri,"Segoe UI",sans-serif}
.ring .time.warn{color:var(--red)}
.presets button{min-width:3.4em}
.presets button.on{background:var(--purple);color:#fff}
.custom input{width:4em;font:inherit;padding:.3em;border:1px solid var(--line);border-radius:.5em;text-align:center}

/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
.ov.show{display:flex}
#cele{pointer-events:none}
#cele .msg{background:#fff;border:4px solid var(--gold);border-radius:1em;padding:.6em 1.4em;text-align:center;box-shadow:0 1em 3em rgba(0,0,0,.18);animation:zoom .5s cubic-bezier(.2,1.6,.4,1)}
#cele .e{font-size:3em}
#cele .t{font-family:Calibri,"Segoe UI",sans-serif;font-size:2.2em;font-weight:800;color:var(--purple-d)}
#cele .s{font-size:1.1em;color:var(--green);font-weight:700;margin-top:.2em}
@keyframes zoom{from{transform:scale(.3);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19;width:100%;height:100%}
#timeup{background:rgba(207,90,82,.92);color:#fff;flex-direction:column;gap:.6em;cursor:pointer}
#timeup .t{font-size:3em;font-weight:800;font-family:Calibri,"Segoe UI",sans-serif}

#mg{background:rgba(46,38,64,.45)}
.modal{background:#fff;border-radius:1em;padding:1em;width:min(34em,94vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:.6em}
.modal h2{font-size:1.25em;color:var(--purple-d)}
.modal input,.modal textarea,.modal select{font:inherit;width:100%;padding:.45em .6em;border:1px solid var(--line);border-radius:.55em;color:var(--ink);background:#fff}
.modal textarea{min-height:11em;resize:vertical;line-height:1.6;user-select:text;-webkit-user-select:text}
.modal .hint{font-size:.82em;color:var(--muted)}
.modal .acts{display:flex;gap:.4em;flex-wrap:wrap}
.modal .acts .sp{flex:1}

.seg{display:inline-flex;background:var(--lav);border-radius:.7em;padding:.2em;gap:.15em;flex-wrap:wrap}
.seg button{background:transparent;padding:.35em .7em}
.seg button.on{background:var(--purple);color:#fff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.5em;margin:1.2em auto .6em;max-width:36em}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25em;max-width:12em;min-width:0}
.step .who{font-family:Calibri,"Segoe UI",sans-serif;font-weight:800;text-align:center;font-size:1.1em;min-height:2.6em;display:flex;align-items:flex-end;justify-content:center;line-height:1.25;word-break:break-word}
.step .who.q{color:var(--muted);font-size:1.6em}
.step.shown .who{animation:pop .5s}
.step .medal{font-size:2em;line-height:1}
.step .block{width:100%;border-radius:.6em .6em 0 0;display:flex;flex-direction:column;align-items:center;padding-top:.35em;color:#fff;font-weight:800;font-size:1.6em}
.step.p1 .block{height:8.5em;background:linear-gradient(#f0c040,#c98f0d)}
.step.p2 .block{height:6.2em;background:linear-gradient(#b9b3c8,#857e97)}
.step.p3 .block{height:4.8em;background:linear-gradient(#e0aa7a,#b07444)}
.step .pts{font-size:.55em;font-weight:700}
.rest{max-width:30em;margin:.4em auto 0;display:flex;flex-direction:column;gap:.25em}
.rest div{display:flex;justify-content:space-between;gap:.5em;background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.3em .7em}
.center{text-align:center}
.tblwrap{overflow-x:auto;border-radius:.7em;border:1px solid var(--line)}
table.prog{width:100%;border-collapse:collapse;background:#fff}
table.prog th,table.prog td{padding:.4em .5em;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.prog th{background:var(--lav);color:var(--purple-d);cursor:pointer;font-size:.88em}
table.prog th.on{background:var(--purple);color:#fff}
table.prog td.n{text-align:start;font-weight:600;white-space:normal;min-width:7em}
table.prog td.top{color:#b07d00;font-weight:800}
.bar{height:.35em;background:var(--lav);border-radius:1em;margin-top:.25em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:1em}
.section{margin-top:1em}
.section h3{font-size:1em;color:var(--purple-d);margin-bottom:.4em}
.logl{display:flex;flex-direction:column;gap:.2em;font-size:.88em}
.logl div{display:flex;gap:.6em;justify-content:space-between;background:#fff;border-radius:.4em;padding:.3em .6em}
.logl .plus{color:var(--green);font-weight:700}.logl .minus2{color:var(--red);font-weight:700}
#bk{background:rgba(46,38,64,.45)}
#toast{position:fixed;bottom:2em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5em 1.1em;border-radius:2em;z-index:40;display:none;max-width:90vw;text-align:center}
#toast.show{display:block;animation:zoom .3s}
body.slide{font-size:clamp(14px,3.6vmin,34px)}
body.slide .grid{grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr))}
</style>
</head>
<body>
<header>
  <h1 class="cal">⭐ رفيق الحصة</h1>
  <select id="clsSel" title="الفصل"></select>
  <span class="badge" id="tBadge" title="المؤقت يعمل"></span>
  <nav class="tabs">
    <button data-tab="stars" class="on">⭐ تعزيز</button>
    <button data-tab="podium">🏆 المتميزات</button>
    <button data-tab="pick">🎲 عشوائي</button>
    <button data-tab="timer">⏱ مؤقت</button>
    <button data-tab="prog">📈 التقدم</button>
  </nav>
  <button class="hbtn" id="sndBtn" title="الصوت">🔊</button>
  <button class="hbtn" id="flBtn" title="نافذة عائمة تبقى ظاهرة أثناء العرض" style="display:none">🗗</button>
  <button class="hbtn" id="mgBtn" title="أسماء الطالبات والفصول">⚙️</button>
</header>
<main id="main"></main>
<footer>للمعلمة: عهود جويهر</footer>

<canvas id="fx"></canvas>
<div class="ov" id="cele"><div class="msg"><div class="e" id="ceE">⭐</div><div class="t" id="ceT"></div><div class="s" id="ceS"></div></div></div>
<div class="ov" id="timeup"><div style="font-size:4em">⏰</div><div class="t">انتهى الوقت</div><div>اضغطي للإغلاق</div></div>
<div class="ov" id="bk">
  <div class="modal">
    <h2 class="cal" id="bkT"></h2>
    <div class="hint" id="bkH"></div>
    <textarea id="bkTx" spellcheck="false" dir="ltr"></textarea>
    <input type="file" id="bkF" accept=".json,.txt,application/json,text/plain" style="display:none">
    <div class="acts" id="bkA"></div>
  </div>
</div>
<div id="toast"></div>
<div class="ov" id="ask" style="background:rgba(46,38,64,.45);z-index:45">
  <div class="modal" style="width:min(24em,92vw);text-align:center">
    <div id="askT" style="font-size:1.05em;line-height:1.6"></div>
    <div class="acts" style="justify-content:center"><button class="primary" id="askY">نعم</button><button id="askN">إلغاء</button></div>
  </div>
</div>
<div class="ov" id="mg">
  <div class="modal">
    <h2 class="cal">أسماء الطالبات والفصول</h2>
    <select id="mgSel"></select>
    <input id="mgName" placeholder="اسم الفصل، مثل: ٣/١ مسار عام">
    <textarea id="mgList" placeholder="اكتبي أو الصقي أسماء الطالبات، اسم في كل سطر"></textarea>
    <div class="hint">يمكنك نسخ عمود الأسماء من إكسل أو من نظام نور ولصقه هنا مباشرة. نجوم الطالبات الموجودات تبقى كما هي عند التعديل.</div>
    <div class="acts">
      <button class="primary" id="mgSave">حفظ</button>
      <button id="mgNew">＋ فصل جديد</button>
      <span class="sp"></span>
      <button class="danger" id="mgDel">حذف الفصل</button>
      <button class="ghost" id="mgClose">إغلاق</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY = "rafeeq-alhessa-v1";
var state = null, inOffice = false, started = false;
var tab = "stars", sortMode = "name";
var $ = function(id){ return document.getElementById(id); };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- storage: داخل ملف العرض + نسخة على الجهاز ---------- */
function defaultState(){ var id = uid(); return {v:1, updatedAt:0, current:id, sound:true, noRepeat:true,
  classes:[{id:id, name:"فصلي", students:[], picked:[]}]}; }
function valid(s){ return s && Array.isArray(s.classes) && s.classes.length > 0; }
function readLocal(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function readDoc(){ try{ if(inOffice){ var s = Office.context.document.settings.get(KEY); return s ? JSON.parse(s) : null; } }catch(e){} return null; }
function newest(a,b){ if(!valid(a)) return valid(b) ? b : null; if(!valid(b)) return a; return (a.updatedAt||0) >= (b.updatedAt||0) ? a : b; }
function norm(s){
  s.classes.forEach(function(c){
    c.students = c.students || []; c.picked = c.picked || [];
    if(!c.log){ c.log = []; c.students.forEach(function(st){ if(st.points > 0) c.log.push([st.id, 0, st.points]); }); }
  });
  if(!s.classes.some(function(c){ return c.id === s.current; })) s.current = s.classes[0].id;
  return s;
}
function nowMin(){ return Math.floor(Date.now()/60000); }
function logAdd(c, sid, d){
  c.log = c.log || []; c.log.push([sid, nowMin(), d]);
  if(c.log.length > 12000){ // دمج أقدم السجلات في رصيد سابق للحفاظ على حجم الملف
    var old = c.log.splice(0, 4000), agg = {};
    old.forEach(function(e){ agg[e[0]] = (agg[e[0]]||0) + e[2]; });
    Object.keys(agg).forEach(function(k){ c.log.unshift([k, 0, agg[k]]); });
  }
}
function save(){
  state.updatedAt = Date.now();
  var s = JSON.stringify(state);
  try{ localStorage.setItem(KEY, s); }catch(e){}
  if(inOffice){ try{ Office.context.document.settings.set(KEY, s); Office.context.document.settings.saveAsync(function(){}); }catch(e){} }
}
function cls(){ for(var i=0;i<state.classes.length;i++){ if(state.classes[i].id === state.current) return state.classes[i]; } return state.classes[0]; }

function start(){
  if(started) return; started = true;
  state = norm(newest(readDoc(), readLocal()) || defaultState());
  render();
}
var isFloat = /[?&](float|slide)=1/.test(location.search);
if(/[?&]slide=1/.test(location.search)) document.body.classList.add("slide");
var dlg = null;
function setupFloat(){
  var b = $("flBtn");
  if(isFloat || !inOffice || !Office.context.ui || !Office.context.ui.displayDialogAsync) return;
  b.style.display = "";
  b.onclick = function(){
    if(dlg){ try{ dlg.close(); }catch(e){} dlg = null; }
    Office.context.ui.displayDialogAsync(location.href.split("?")[0].split("#")[0] + "?float=1",
      {height:65, width:55, displayInIframe:false}, function(r){
        if(r.status === Office.AsyncResultStatus.Succeeded){
          dlg = r.value;
          dlg.addEventHandler(Office.EventType.DialogEventReceived, function(){ dlg = null; var l = readLocal(); if(valid(l)){ state = norm(newest(state, l)); save(); render(); } });
        } else { note("تعذر فتح النافذة العائمة (رمز " + (r.error ? r.error.code : "؟") + "). أغلقي أي نافذة عائمة مفتوحة ثم أعيدي المحاولة."); }
      });
  };
}
if(typeof Office !== "undefined" && Office.onReady){
  Office.onReady(function(info){
    inOffice = !!(info && info.host);
    if(started){ var d = readDoc(); if(valid(d) && (d.updatedAt||0) > (state.updatedAt||0)){ state = norm(d); render(); } }
    start(); setupFloat();
  });
  setTimeout(start, 2500);
} else { start(); }
// مزامنة بين أكثر من نسخة من المساعد في العرض نفسه
window.addEventListener("storage", function(e){
  if(e.key !== KEY || !e.newValue || !state) return;
  try{ var n = JSON.parse(e.newValue); if(valid(n) && (n.updatedAt||0) > (state.updatedAt||0)){ state = norm(n); render(); } }catch(_){}
});

/* ---------- sound ---------- */
var actx = null;
function tone(f, dur, delay, type){
  if(!state || !state.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var t = actx.currentTime + (delay||0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function chime(){ tone(660,.25,0); tone(880,.25,.12); tone(1320,.45,.24); }
function tick(){ tone(520,.05,0,"triangle"); }
function alarm(){ for(var i=0;i<3;i++){ tone(880,.35,i*.5,"square"); tone(660,.35,i*.5+.2,"square"); } }

/* ---------- header ---------- */
function renderHeader(){
  var sel = $("clsSel");
  sel.innerHTML = state.classes.map(function(c){ return '<option value="'+c.id+'"'+(c.id===state.current?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("");
  $("sndBtn").textContent = state.sound ? "🔊" : "🔇";
  var bs = document.querySelectorAll(".tabs button");
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-tab") === tab);
}
$("clsSel").onchange = function(){ state.current = this.value; save(); lastPicked = null; render(); };
$("sndBtn").onclick = function(){ state.sound = !state.sound; save(); renderHeader(); };
(function(){ var bs = document.querySelectorAll(".tabs button");
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){ tab = this.getAttribute("data-tab"); render(); }; })();

function render(){ if(!state) return; renderHeader(); if(tab==="stars") renderStars(); else if(tab==="podium") renderPodium(); else if(tab==="pick") renderPick(); else if(tab==="prog") renderProg(); else renderTimer(); }

function emptyView(){
  $("main").innerHTML = '<div class="empty"><div class="big">👩‍🎓</div><div>لا توجد أسماء طالبات في هذا الفصل بعد</div><button class="primary" id="goMg">أضيفي أسماء الطالبات</button></div>';
  $("goMg").onclick = openMg;
}

/* ---------- التعزيز ---------- */
var praise = ["أحسنتِ","رائعة","مبدعة","تألقتِ","ممتازة","بطلة","متميزة","ما شاء الله"];
var praiseSub = ["استمري يا بطلة","إجابة متقنة","بارك الله فيكِ","عمل ممتاز","فخورون بكِ","تفكير جميل"];
function renderStars(){
  var c = cls(); if(!c.students.length) return emptyView();
  var max = 0; c.students.forEach(function(s){ if(s.points > max) max = s.points; });
  var list = c.students.slice();
  if(sortMode === "points") list.sort(function(a,b){ return b.points - a.points || a.name.localeCompare(b.name,"ar"); });
  var h = '<div class="toolbar">'+
    '<button id="srt">'+(sortMode==="name" ? "↕ ترتيب حسب النجوم" : "↕ الترتيب الأصلي")+'</button>'+
    '<button class="green" id="allUp">⭐ نجمة للجميع</button><span class="sp"></span>'+
    '<span class="muted">اضغطي على اسم الطالبة لتعزيزها</span>'+
    '<button class="danger" id="rst">تصفير النجوم</button></div><div class="grid">';
  list.forEach(function(s){

    off += lh.length + name.length + data.length;
  });
  var cs = 0; cen.forEach(function(x){ cs += x.length; });
  var end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cs), u32(off), u16(0)));
  return new Blob(parts.concat(cen, [end]), {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xe(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function colName(i){ var s = ""; i++; while(i > 0){ var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function makeXlsx(sheets){
  var files = [], ov = "", rels = "", wbs = "";
  sheets.forEach(function(sh, si){
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>';
    if(sh.widths) x += '<cols>' + sh.widths.map(function(w, i){ return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'; }).join("") + '</cols>';
    x += '<sheetData>';
    sh.rows.forEach(function(r, ri){
      var st = (sh.bold || []).indexOf(ri) >= 0 ? ' s="1"' : '';
      x += '<row r="'+(ri+1)+'">' + r.map(function(v, ci){
        var ref = colName(ci) + (ri+1);
        return typeof v === "number" ? '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>' : '<c r="'+ref+'"'+st+' t="inlineStr"><is><t>'+xe(v)+'</t></is></c>';
      }).join("") + '</row>';
    });
    x += '</sheetData></worksheet>';
    files.push({name:"xl/worksheets/sheet"+(si+1)+".xml", data:x});
    ov += '<Override PartName="/xl/worksheets/sheet'+(si+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    rels += '<Relationship Id="rId'+(si+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(si+1)+'.xml"/>';
    wbs += '<sheet name="'+xe(sh.name)+'" sheetId="'+(si+1)+'" r:id="rId'+(si+1)+'"/>';
  });
  var n = sheets.length + 1;
  files.unshift(
    {name:"[Content_Types].xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+ov+'</Types>'},
    {name:"_rels/.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+wbs+'</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'<Relationship Id="rId'+n+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'}
  );
  return zip(files);
}
function exportXlsx(){
  var c = cls();
  var head = ["م"].concat(COLS.map(function(k){ return k[1]; }));
  var sum = progRows(c).sort(function(a,b){ return b.all - a.all; }).map(function(r, i){ return [i+1, r.name, r.day, r.week, r.month, r.all, r.cur]; });
  var byId = {}; c.students.forEach(function(s){ byId[s.id] = s.name; });
  var logRows = (c.log||[]).filter(function(e){ return e[1] > 0; }).map(function(e){
    var d = new Date(e[1]*60000);
    return [d.toLocaleDateString("ar-SA", {day:"numeric", month:"long", year:"numeric"}),
      d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2),
      d.toLocaleTimeString("ar-SA", {hour:"numeric", minute:"2-digit"}), byId[e[0]] || "طالبة محذوفة", e[2]];
  });
  var blob = makeXlsx([
    {name:"الملخص", rows:[["رفيق الحصة — " + c.name + " — " + todayIso()], []].concat([head], sum), bold:[0,2], widths:[6,28,9,10,10,13,15]},
    {name:"سجل المشاركات", rows:[["التاريخ (هجري)","التاريخ (ميلادي)","الوقت","الطالبة","النجوم"]].concat(logRows), bold:[0], widths:[22,15,11,28,9]}
  ]);
  download("تقدم الطالبات - " + safeName(c.name) + " - " + todayIso() + ".xlsx", blob);
  toast("تم تنزيل ملف إكسل. إن لم يظهر، استخدمي «نسخ الجدول»");
}

/* ---------- النسخة الاحتياطية ---------- */
function openBk(mode){
  var tx = $("bkTx"), acts = $("bkA");
  if(mode === "backup"){
    $("bkT").textContent = "💾 النسخة الاحتياطية";
    $("bkH").textContent = "تحتوي على جميع الفصول والأسماء والنجوم والسجل. نزّليها ملفًا أو انسخيها، ثم استرجعيها على أي جهاز من زر «استرجاع».";
    tx.value = JSON.stringify(state); tx.readOnly = true;
    acts.innerHTML = '<button class="green" id="bkDl">📥 تنزيل ملف</button><button id="bkCp">📋 نسخ</button><span class="sp"></span><button class="ghost" id="bkX">إغلاق</button>';
    $("bkDl").onclick = function(){ download("رفيق الحصة - نسخة احتياطية - " + todayIso() + ".json", JSON.stringify(state), "application/json"); toast("تم تنزيل النسخة الاحتياطية"); };
    $("bkCp").onclick = function(){ copyText(JSON.stringify(state), "تم نسخ النسخة الاحتياطية"); };
  } else {
    $("bkT").textContent = "♻️ استرجاع نسخة احتياطية";
    $("bkH").textContent = "اختاري ملف النسخة الاحتياطية، أو الصقي محتواها في المربع. ستحل محل البيانات الحالية في المساعد.";
    tx.value = ""; tx.readOnly = false; tx.placeholder = "الصقي النسخة الاحتياطية هنا…";
    acts.innerHTML = '<button id="bkPick">📂 اختيار ملف</button><button class="primary" id="bkGo">♻️ استرجاع</button><span class="sp"></span><button class="ghost" id="bkX">إغلاق</button>';
    $("bkPick").onclick = function(){ $("bkF").value = ""; $("bkF").click(); };
    $("bkF").onchange = function(){ var f = this.files && this.files[0]; if(!f) return; var r = new FileReader(); r.onload = function(){ tx.value = r.result; }; r.readAsText(f); };
    $("bkGo").onclick = function(){
      var obj = null; try{ obj = JSON.parse(tx.value.trim()); }catch(e){}
      if(!valid(obj)){ note("هذه ليست نسخة احتياطية صالحة من رفيق الحصة."); return; }
      ask("سيتم استبدال بيانات المساعد الحالية بالنسخة الاحتياطية. هل تريدين المتابعة؟", function(){
        state = norm(obj); lastPicked = null; save(); $("bk").classList.remove("show"); render(); toast("تم الاسترجاع بنجاح");
      });
    };
  }
  $("bkX").onclick = function(){ $("bk").classList.remove("show"); };
  $("bk").classList.add("show");
}

/* ---------- إدارة الأسماء ---------- */
var mgId = null;
function openMg(){ mgId = state.current; fillMg(); $("mg").classList.add("show"); }
function fillMg(){
  $("mgSel").innerHTML = state.classes.map(function(c){ return '<option value="'+c.id+'"'+(c.id===mgId?" selected":"")+'>'+esc(c.name)+' ('+c.students.length+')</option>'; }).join("");
  var c = state.classes.filter(function(x){ return x.id===mgId; })[0] || state.classes[0]; mgId = c.id;
  $("mgName").value = c.name;
  $("mgList").value = c.students.map(function(s){ return s.name; }).join("\n");
}
$("mgBtn").onclick = openMg;
$("mgSel").onchange = function(){ mgId = this.value; fillMg(); };
$("mgClose").onclick = function(){ $("mg").classList.remove("show"); };
$("mgSave").onclick = function(){
  var c = state.classes.filter(function(x){ return x.id===mgId; })[0]; if(!c) return;
  c.name = $("mgName").value.trim() || "فصل";
  var seen = {}, names = $("mgList").value.split(/\r?\n|\t|،|,/).map(function(n){ return n.replace(/^\s*\d+[\.\-\)]?\s*/, "").trim(); })
    .filter(function(n){ if(!n || seen[n]) return false; seen[n] = 1; return true; });
  var old = {}; c.students.forEach(function(s){ old[s.name] = s; });
  c.students = names.map(function(n){ return old[n] || {id:uid(), name:n, points:0}; });
  var ids = c.students.map(function(s){ return s.id; });
  c.picked = c.picked.filter(function(id){ return ids.indexOf(id) >= 0; });
  state.current = c.id; lastPicked = null; save();
  $("mg").classList.remove("show"); render();
};
$("mgNew").onclick = function(){
  var id = uid(); state.classes.push({id:id, name:"فصل "+(state.classes.length+1), students:[], picked:[]});
  mgId = id; save(); fillMg(); $("mgName").focus(); $("mgName").select();
};
$("mgDel").onclick = function(){
  if(state.classes.length < 2){ note("لا يمكن حذف الفصل الوحيد. يمكنك تعديل اسمه وأسماء طالباته."); return; }
  var c = state.classes.filter(function(x){ return x.id===mgId; })[0];
  ask("حذف فصل «"+c.name+"» وجميع نجوم طالباته؟", function(){
  state.classes = state.classes.filter(function(x){ return x.id!==mgId; });
  if(state.current === mgId) state.current = state.classes[0].id;
  mgId = state.current; save(); fillMg(); render();
});
};
})();
</script>

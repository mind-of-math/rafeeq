<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>مُلهِم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#7c5cc4">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --purple:#7c5cc4; --purple-d:#5b3fa0; --lav:#efe9f9; --beige:#f7f2e8;
  --green:#4f9a6c; --green-l:#e3f2e8; --ink:#2e2640; --muted:#7a7290;
  --red:#cf5a52; --gold:#e5ad22; --card:#fff; --line:#e3dcef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft Uighur","Segoe UI",Tahoma,Arial,sans-serif;background:var(--beige);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;font-size:clamp(15px,2.9vmin,27px);user-select:none;-webkit-user-select:none}
h1,h2,h3,.cal{font-family:"beIN Black","beIN-Black","bein black","Segoe UI",Tahoma,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:.6em;padding:.45em .9em;background:var(--lav);color:var(--purple-d);font-weight:600;transition:transform .08s,background .2s}
button:active{transform:scale(.96)}
button.primary{background:var(--purple);color:#fff}
button.green{background:var(--green);color:#fff}
button.ghost{background:transparent;color:inherit}
button.danger{background:#fbe6e4;color:var(--red)}

header{display:flex;align-items:center;gap:.5em;padding:.45em .7em;background:var(--purple);color:#fff;flex-wrap:wrap}
header h1{font-size:1.15em;font-weight:700;white-space:nowrap}
header select{font:inherit;border:0;border-radius:.5em;padding:.25em .5em;background:#fff;color:var(--ink);max-width:12em}
.tabs{display:flex;gap:.3em;margin-inline-start:auto;flex-wrap:wrap}
@media (max-width:480px){body{font-size:14px}.tabs{order:9;width:100%;margin:0}.tabs button{flex:1;padding:.4em .3em}.grid{grid-template-columns:repeat(auto-fill,minmax(7em,1fr))}.pickName{font-size:2.2em}}
.tabs button{background:rgba(255,255,255,.16);color:#fff;padding:.4em .8em}
.tabs button.on{background:#fff;color:var(--purple-d)}
.hbtn{background:rgba(255,255,255,.16);color:#fff;padding:.4em .6em}
.badge{background:var(--gold);color:#3b2a00;border-radius:2em;padding:.15em .6em;font-weight:700;font-variant-numeric:tabular-nums;display:none}
.badge.show{display:inline-block}

main{flex:1;overflow:auto;padding:.7em}
footer{text-align:center;font-size:.72em;color:var(--muted);padding:.25em}

.toolbar{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin-bottom:.6em}
.toolbar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:.55em}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:.9em;padding:.6em .5em .5em;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--purple);box-shadow:0 .3em .8em rgba(124,92,196,.15)}
.card:active{transform:scale(.97)}
.card .nm{font-family:Calibri,"Segoe UI",sans-serif;font-weight:700;font-size:.8em;line-height:1.25;min-height:1.3em;word-break:break-word}
.card .pt{font-size:1.5em;font-weight:800;color:var(--gold);margin-top:.15em;font-variant-numeric:tabular-nums}
.card .crown{position:absolute;top:-.55em;inset-inline-start:.4em;font-size:1.2em}
.card .minus{position:absolute;bottom:.3em;inset-inline-end:.3em;width:1.6em;height:1.6em;padding:0;border-radius:50%;background:var(--lav);color:var(--muted);font-size:.85em;opacity:.55}
.card .minus:hover{opacity:1}
.card .pt .mq{font-size:.62em;font-weight:700;color:var(--purple)}
.card .tot{font-size:.8em;color:var(--muted);margin-top:.1em}
.card.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.1);border-color:var(--gold)}}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;color:var(--muted)}
.empty .big{font-size:3em}

/* picker */
.pick{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;text-align:center}
.pickName{font-family:Calibri,"Segoe UI",sans-serif;font-size:2.7em;font-weight:800;color:var(--purple-d);min-height:1.3em;line-height:1.2;padding:.2em .6em;border-radius:.4em;background:#fff;border:3px dashed var(--line);min-width:60%}
.pickName.done{border:3px solid var(--green);background:var(--green-l);color:var(--green);animation:pop .5s}
.pickName.rolling{color:var(--muted)}
.row{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;align-items:center}
.muted{color:var(--muted);font-size:.9em}
label.chk{display:inline-flex;gap:.35em;align-items:center;cursor:pointer;color:var(--muted);font-size:.9em}

/* timer */
.timer{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em}
.ring{position:relative;width:min(48vmin,60vh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--lav)}
.ring .fg{stroke:var(--green);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring .fg.warn{stroke:var(--red)}
.ring .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,10vmin,110px);font-weight:800;font-variant-numeric:tabular-nums;font-family:"beIN Black","beIN-Black","bein black","Segoe UI",Tahoma,sans-serif}
.ring .time.warn{color:var(--red)}
.presets button{min-width:3.4em}
.presets button.on{background:var(--purple);color:#fff}
.custom input{width:4em;font:inherit;padding:.3em;border:1px solid var(--line);border-radius:.5em;text-align:center}

/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
.ov.show{display:flex}
#cele{pointer-events:none}
#cele .msg{background:#fff;border:4px solid var(--gold);border-radius:1em;padding:.6em 1.4em;text-align:center;box-shadow:0 1em 3em rgba(0,0,0,.18);animation:zoom .5s cubic-bezier(.2,1.6,.4,1)}
#cele .e{font-size:3em}
#cele .t{font-family:"beIN Black","beIN-Black","bein black","Segoe UI",Tahoma,sans-serif;font-size:2.2em;font-weight:800;color:var(--purple-d)}
#cele .s{font-size:1.1em;color:var(--green);font-weight:700;margin-top:.2em}
@keyframes zoom{from{transform:scale(.3);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19;width:100%;height:100%}
#timeup{background:rgba(207,90,82,.92);color:#fff;flex-direction:column;gap:.6em;cursor:pointer}
#timeup .t{font-size:3em;font-weight:800;font-family:"beIN Black","beIN-Black","bein black","Segoe UI",Tahoma,sans-serif}

#mg{background:rgba(46,38,64,.45)}
.modal{background:#fff;border-radius:1em;padding:1em;width:min(34em,94vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:.6em}
.modal h2{font-size:1.25em;color:var(--purple-d)}
.modal input,.modal textarea,.modal select{font:inherit;width:100%;padding:.45em .6em;border:1px solid var(--line);border-radius:.55em;color:var(--ink);background:#fff}
.modal textarea{min-height:11em;resize:vertical;line-height:1.6;user-select:text;-webkit-user-select:text}
.modal .hint{font-size:.82em;color:var(--muted)}
.modal .acts{display:flex;gap:.4em;flex-wrap:wrap}
.modal .acts .sp{flex:1}

.seg{display:inline-flex;background:var(--lav);border-radius:.7em;padding:.2em;gap:.15em;flex-wrap:wrap}
.seg button{background:transparent;padding:.35em .7em}
.seg button.on{background:var(--purple);color:#fff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.5em;margin:1.2em auto .6em;max-width:36em}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25em;max-width:12em;min-width:0}
.step .who{font-family:Calibri,"Segoe UI",sans-serif;font-weight:800;text-align:center;font-size:.85em;min-height:2.6em;display:flex;align-items:flex-end;justify-content:center;line-height:1.25;word-break:break-word}
.step .who.q{color:var(--muted);font-size:1.6em}
.step.shown .who{animation:pop .5s}
.step .medal{font-size:2em;line-height:1}
.step .block{width:100%;border-radius:.6em .6em 0 0;display:flex;flex-direction:column;align-items:center;padding-top:.35em;color:#fff;font-weight:800;font-size:1.6em}
.step.p1 .block{height:8.5em;background:linear-gradient(#f0c040,#c98f0d)}
.step.p2 .block{height:6.2em;background:linear-gradient(#b9b3c8,#857e97)}
.step.p3 .block{height:4.8em;background:linear-gradient(#e0aa7a,#b07444)}
.step .pts{font-size:.55em;font-weight:700}
.rest{max-width:30em;margin:.4em auto 0;display:flex;flex-direction:column;gap:.25em}
.rest div{display:flex;justify-content:space-between;gap:.5em;background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.3em .7em}
.center{text-align:center}
.tblwrap{overflow-x:auto;border-radius:.7em;border:1px solid var(--line)}
table.prog{width:100%;border-collapse:collapse;background:#fff}
table.prog th,table.prog td{padding:.4em .5em;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.prog th{background:var(--lav);color:var(--purple-d);cursor:pointer;font-size:.88em}
table.prog th.on{background:var(--purple);color:#fff}
table.prog td.n{text-align:start;font-weight:600;white-space:normal;min-width:7em}
table.prog td.top{color:#b07d00;font-weight:800}
.bar{height:.35em;background:var(--lav);border-radius:1em;margin-top:.25em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:1em}
.section{margin-top:1em}
.section h3{font-size:1em;color:var(--purple-d);margin-bottom:.4em}
.logl{display:flex;flex-direction:column;gap:.2em;font-size:.88em}
.logl div{display:flex;gap:.6em;justify-content:space-between;background:#fff;border-radius:.4em;padding:.3em .6em}
.logl .plus{color:var(--green);font-weight:700}.logl .minus2{color:var(--red);font-weight:700}
#bk{background:rgba(46,38,64,.45)}
#toast{position:fixed;bottom:2em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5em 1.1em;border-radius:2em;z-index:40;display:none;max-width:90vw;text-align:center}
#toast.show{display:block;animation:zoom .3s}
body.slide{font-size:clamp(14px,3.6vmin,34px)}
body.slide .grid{grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr))}
.wheelWrap{position:relative;width:min(62vmin,88vw,440px);aspect-ratio:1;margin:.3em auto 0}
.wheelWrap canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 .3em .6em rgba(0,0,0,.18))}
.wheelWrap .pointer{position:absolute;top:-.35em;left:50%;transform:translateX(-50%);width:0;height:0;border-left:.9em solid transparent;border-right:.9em solid transparent;border-top:1.6em solid var(--red);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.wheelWrap .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--purple-d);font-size:1.15em;font-weight:800;box-shadow:0 .2em .6em rgba(0,0,0,.25);padding:0;border:4px solid var(--purple)}
.wheelWrap .hub:disabled{opacity:.85;cursor:default}
.pick .pickName{font-size:2.3em;min-width:50%}
.gtop{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin-bottom:.6em}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:.6em}
.gcard{background:#fff;border:2px solid var(--line);border-radius:.9em;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.gcard.hl{transform:scale(1.03);box-shadow:0 0 0 4px var(--gold),0 .6em 1.4em rgba(0,0,0,.18)}
.gcard .gh{color:#fff;padding:.45em .6em;display:flex;align-items:center;gap:.4em}
.gcard .gh b{flex:1;font-family:Calibri,"Segoe UI",sans-serif;font-size:.9em}
.gcard .gh .gs{background:rgba(255,255,255,.25);border-radius:1em;padding:.1em .55em;font-weight:700;font-variant-numeric:tabular-nums}
.gcard .gm{padding:.5em;display:flex;flex-wrap:wrap;gap:.35em;min-height:3em;align-content:flex-start;flex:1}
.chip{background:var(--lav);color:var(--ink);border-radius:2em;padding:.25em .65em;font-size:.92em;cursor:pointer;border:1px solid transparent}
.chip:hover{border-color:var(--purple)}
.chip i{font-style:normal;color:#b07d00;font-weight:700;margin-inline-start:.3em}
.gcard .gf{padding:.4em .5em;border-top:1px solid var(--line);display:flex;gap:.4em}
.gcard .gf button{flex:1;padding:.4em}
.unas{margin-top:.7em;background:#fff;border:2px dashed var(--line);border-radius:.9em;padding:.5em}
.gmvb{text-align:start;color:#fff;font-weight:700;padding:.6em .8em}
.card.absent{opacity:.45}
.abtag{position:absolute;top:.3em;inset-inline-end:.4em;font-size:.7em;background:var(--red);color:#fff;border-radius:1em;padding:.05em .5em}
.chip.absent{opacity:.45;text-decoration:line-through}
.attbar{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin-bottom:.5em}
.attbar input[type=date]{font:inherit;padding:.35em .5em;border:1px solid var(--line);border-radius:.55em;background:#fff;color:var(--ink)}
.dayl{font-family:"beIN Black","beIN-Black","bein black","Segoe UI",Tahoma,sans-serif;font-weight:700;color:var(--purple-d);font-size:1.05em}
.days{display:flex;gap:.3em;flex-wrap:wrap;align-items:center}
.days button{padding:.3em .6em;font-size:.88em}
.days button.on{background:var(--purple);color:#fff}
.attsum{display:flex;gap:.5em;flex-wrap:wrap;margin:.3em 0 .6em}
.attsum span{background:#fff;border:1px solid var(--line);border-radius:2em;padding:.2em .8em;font-weight:700}
.attlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.4em}
.attrow{display:flex;align-items:center;gap:.4em;background:#fff;border:2px solid var(--line);border-radius:.7em;padding:.35em .5em}
.attrow.a{border-color:var(--red);background:#fdf0ef}
.attrow.l{border-color:var(--gold);background:#fdf6e3}
.attrow .nm{flex:1;font-weight:600;line-height:1.25}
.attrow .cnt{font-size:.78em;color:var(--muted)}
.attrow button{padding:.3em .5em;font-size:.85em;background:var(--lav);color:var(--muted)}
.attrow button.onA{background:var(--red);color:#fff}
.attrow button.onX{background:#6a5acd;color:#fff}
.attrow.x{border-color:#6a5acd}
.card .st{display:flex;gap:.25em;justify-content:center;margin-top:.35em}
.card .st button{padding:.2em .45em;font-size:.8em;border-radius:.6em;background:var(--lav);color:var(--ink)}
.card .st button.on{background:var(--red);color:#fff}
.card .st button.on.l{background:var(--gold);color:#3b2a00}
.card .st button.on.x{background:#6a5acd;color:#fff}
.abtag.l{background:var(--gold);color:#3b2a00}
.abtag.x{background:#6a5acd}
.card.attm{cursor:default}
.attrow button.onL{background:var(--gold);color:#3b2a00}
.attrow.y{border-color:var(--green);background:var(--green-l)}
.attrow.ab{opacity:.45}
.attrow button.onY{background:var(--green);color:#fff}
.attrow button.onN{background:var(--red);color:#fff}
.hwt{font:inherit;padding:.4em .6em;border:1px solid var(--line);border-radius:.55em;background:#fff;color:var(--ink);min-width:14em;flex:1}
.attrep td.dates{white-space:normal;text-align:start;font-size:.85em;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 class="cal">⭐ مُلهِم</h1>
  <select id="clsSel" title="الفصل"></select>
  <span class="badge" id="tBadge" title="المؤقت يعمل"></span>
  <nav class="tabs">
    <button data-tab="stars" class="on">⭐ تعزيز</button>
    <button data-tab="podium">🏆 المتميزات</button>
    <button data-tab="pick">🎲 عشوائي</button>
    <button data-tab="groups">👥 المجموعات</button>
    <button data-tab="att">📋 الغياب</button>
    <button data-tab="hw">📚 الواجب</button>
    <button data-tab="live">🗳️ سؤال</button>
    <button data-tab="exit">🚪 الخروج</button>
    <button data-tab="sheet">📄 السجل</button>
    <button data-tab="timer">⏱ مؤقت</button>
    <button data-tab="prog">📈 التقدم</button>
  </nav>
  <button class="hbtn" id="sndBtn" title="الصوت">🔊</button>
  <button class="hbtn" id="flBtn" title="نافذة عائمة تبقى ظاهرة أثناء العرض" style="display:none">🗗</button>
  <button class="hbtn" id="mgBtn" title="أسماء الطالبات والفصول">⚙️</button>
</header>
<main id="main"></main>
<footer>للمعلمة: عهود جويهر</footer>

<canvas id="fx"></canvas>
<div class="ov" id="cele"><div class="msg"><div class="e" id="ceE">⭐</div><div class="t" id="ceT"></div><div class="s" id="ceS"></div></div></div>
<div class="ov" id="timeup"><div style="font-size:4em">⏰</div><div class="t">انتهى الوقت</div><div>اضغطي للإغلاق</div></div>
<div class="ov" id="bk">
  <div class="modal">
    <h2 class="cal" id="bkT"></h2>
    <div class="hint" id="bkH"></div>
    <textarea id="bkTx" spellcheck="false" dir="ltr"></textarea>
    <input type="file" id="bkF" accept=".json,.txt,application/json,text/plain" style="display:none">
    <div class="acts" id="bkA"></div>
  </div>
</div>
<div id="toast"></div>
<div class="ov" id="gmv" style="background:rgba(46,38,64,.45);z-index:44">
  <div class="modal" style="width:min(26em,94vw)">
    <h2 class="cal" id="gmvT"></h2>
    <div id="gmvB" style="display:flex;flex-direction:column;gap:.45em"></div>
    <div class="acts"><span class="sp"></span><button class="ghost" id="gmvX">إغلاق</button></div>
  </div>
</div>
<div class="ov" id="ask" style="background:rgba(46,38,64,.45);z-index:45">
  <div class="modal" style="width:min(24em,92vw);text-align:center">
    <div id="askT" style="font-size:1.05em;line-height:1.6"></div>
    <div class="acts" style="justify-content:center"><button class="primary" id="askY">نعم</button><button id="askN">إلغاء</button></div>
  </div>
</div>
<div class="ov" id="mg">
  <div class="modal">
    <h2 class="cal">أسماء الطالبات والفصول</h2>
    <select id="mgSel"></select>
    <input id="mgName" placeholder="اسم الفصل، مثل: ٣/١ مسار عام">
    <textarea id="mgList" placeholder="اكتبي أو الصقي أسماء الطالبات، اسم في كل سطر"></textarea>
    <div class="hint">يمكنك نسخ عمود الأسماء من إكسل أو من نظام نور ولصقه هنا مباشرة. نجوم الطالبات الموجودات تبقى كما هي عند التعديل.</div>
    <div style="border-top:1px solid var(--line);padding-top:.6em;display:flex;flex-direction:column;gap:.45em">
      <h2 class="cal" style="font-size:1.05em">🔗 الربط مع موقع مُتقِن</h2>
      <input id="lnkTok" type="password" dir="ltr" autocomplete="off" placeholder="مفتاح الربط (من لوحة معلمة مُتقِن ← ⭐ ربط رفيق الحصة)">
      <label class="chk"><input type="checkbox" id="lnkAuto" style="width:auto"> إرسال النجوم إلى مُتقِن تلقائيًا</label>
      <div class="acts"><button id="lnkSave">حفظ المفتاح</button><button id="lnkImp">📥 استيراد أسماء الصف</button><button id="lnkSync">🔄 إرسال النجوم الآن</button><button id="lnkStars">📥 جلب نجوم مُتقِن</button></div>
      <div class="hint" id="lnkSt"></div>
    </div>
    <div class="acts">
      <button class="primary" id="mgSave">حفظ</button>
      <button id="mgNew">＋ فصل جديد</button>
      <span class="sp"></span>
      <button class="danger" id="mgDel">حذف الفصل</button>
      <button class="ghost" id="mgClose">إغلاق</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY = "rafeeq-alhessa-v1";
var state = null, inOffice = false, started = false;
var tab = "stars", sortMode = "name", attMode = false;
var $ = function(id){ return document.getElementById(id); };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- storage: داخل ملف العرض + نسخة على الجهاز ---------- */
function defaultState(){ var id = uid(); return {v:1, updatedAt:0, current:id, sound:true, noRepeat:true,
  classes:[{id:id, name:"فصلي", students:[], picked:[]}]}; }
function valid(s){ return s && Array.isArray(s.classes) && s.classes.length > 0; }
function readLocal(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function readDoc(){ try{ if(inOffice){ var s = Office.context.document.settings.get(KEY); return s ? JSON.parse(s) : null; } }catch(e){} return null; }
function newest(a,b){ if(!valid(a)) return valid(b) ? b : null; if(!valid(b)) return a; return (a.updatedAt||0) >= (b.updatedAt||0) ? a : b; }
function norm(s){
  s.classes.forEach(function(c){
    c.students = c.students || []; c.picked = c.picked || [];
    c.groups = c.groups || {}; c.att = c.att || {}; c.hw = c.hw || {}; c.exits = c.exits || {}; if(!Array.isArray(c.days)) c.days = [0, 1, 2, 3, 4];
    ["orig", "diff"].forEach(function(k){ var g = c.groups[k] = c.groups[k] || {}; g.names = g.names || GDEF[k].slice(); g.map = g.map || {}; });
    if(!c.log){ c.log = []; c.students.forEach(function(st){ if(st.points > 0) c.log.push([st.id, 0, st.points]); }); }
    // نسخة سابقة كانت تدمج نجوم مُتقِن في نجوم الحصة: نُعيد ما أُضيف فقط (المسجّل بعلامة mq) ونُبقي بقية النجوم كما هي،
    // وتبقى نجوم مُتقِن ظاهرة منفصلة في الحقل mq.
    var merged = {}, keep = [];
    c.log.forEach(function(e){ if(e[3] === "mq") merged[e[0]] = (merged[e[0]] || 0) + e[2]; else keep.push(e); });
    if(keep.length !== c.log.length){
      c.students.forEach(function(st){ if(merged[st.id]) st.points = Math.max(0, (st.points || 0) - merged[st.id]); });
      c.log = keep;
    }
  });
  if(!s.classes.some(function(c){ return c.id === s.current; })) s.current = s.classes[0].id;
  return s;
}
var GDEF = {orig: ["المجموعة 1", "المجموعة 2", "المجموعة 3", "المجموعة 4"], diff: ["المجموعة الزرقاء", "المجموعة الخضراء", "المجموعة الصفراء", "المجموعة البرتقالية"]};
var GCOL = {orig: ["#7c5cc4", "#3d9a9b", "#d9628c", "#4f86c6"], diff: ["#4f86c6", "#4f9a6c", "#d9a21b", "#e07a5f"]};
function nowMin(){ return Math.floor(Date.now()/60000); }
function logAdd(c, sid, d){
  c.log = c.log || []; c.log.push([sid, nowMin(), d]);
  if(c.log.length > 12000){ // دمج أقدم السجلات في رصيد سابق للحفاظ على حجم الملف
    var old = c.log.splice(0, 4000), agg = {};
    old.forEach(function(e){ agg[e[0]] = (agg[e[0]]||0) + e[2]; });
    Object.keys(agg).forEach(function(k){ c.log.unshift([k, 0, agg[k]]); });
  }
}
function save(){
  state.updatedAt = Date.now();
  var s = JSON.stringify(state);
  try{ localStorage.setItem(KEY, s); }catch(e){}
  scheduleSync();
  if(inOffice){ try{ Office.context.document.settings.set(KEY, s); Office.context.document.settings.saveAsync(function(){}); }catch(e){} }
}
function cls(){ for(var i=0;i<state.classes.length;i++){ if(state.classes[i].id === state.current) return state.classes[i]; } return state.classes[0]; }

function start(){
  if(started) return; started = true;
  state = norm(newest(readDoc(), readLocal()) || defaultState());
  render();
}
var isFloat = /[?&](float|slide)=1/.test(location.search);
if(/[?&]slide=1/.test(location.search)) document.body.classList.add("slide");
var dlg = null;
function setupFloat(){
  var b = $("flBtn");
  if(isFloat || !inOffice || !Office.context.ui || !Office.context.ui.displayDialogAsync) return;
  b.style.display = "";
  b.onclick = function(){
    if(dlg){ try{ dlg.close(); }catch(e){} dlg = null; }
    Office.context.ui.displayDialogAsync(location.href.split("?")[0].split("#")[0] + "?float=1",
      {height:65, width:55, displayInIframe:false}, function(r){
        if(r.status === Office.AsyncResultStatus.Succeeded){
          dlg = r.value;
          dlg.addEventHandler(Office.EventType.DialogEventReceived, function(){ dlg = null; var l = readLocal(); if(valid(l)){ state = norm(newest(state, l)); save(); render(); } });
        } else { note("تعذر فتح النافذة العائمة (رمز " + (r.error ? r.error.code : "؟") + "). أغلقي أي نافذة عائمة مفتوحة ثم أعيدي المحاولة."); }
      });
  };
}
if(typeof Office !== "undefined" && Office.onReady){
  Office.onReady(function(info){
    inOffice = !!(info && info.host);
    if(started){ var d = readDoc(); if(valid(d) && (d.updatedAt||0) > (state.updatedAt||0)){ state = norm(d); render(); } }
    start(); setupFloat();
  });
  setTimeout(start, 2500);
} else { start(); }
// مزامنة بين أكثر من نسخة من المساعد في العرض نفسه
window.addEventListener("storage", function(e){
  if(e.key !== KEY || !e.newValue || !state) return;
  try{ var n = JSON.parse(e.newValue); if(valid(n) && (n.updatedAt||0) > (state.updatedAt||0)){ state = norm(n); render(); } }catch(_){}
});

/* ---------- sound ---------- */
var actx = null;
function tone(f, dur, delay, type){
  if(!state || !state.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var t = actx.currentTime + (delay||0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function chime(){ tone(660,.25,0); tone(880,.25,.12); tone(1320,.45,.24); }
function tick(){ tone(520,.05,0,"triangle"); }
function alarm(){ for(var i=0;i<3;i++){ tone(880,.35,i*.5,"square"); tone(660,.35,i*.5+.2,"square"); } }

/* ---------- header ---------- */
function renderHeader(){
  var sel = $("clsSel");
  sel.innerHTML = state.classes.map(function(c){ return '<option value="'+c.id+'"'+(c.id===state.current?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("");
  $("sndBtn").textContent = state.sound ? "🔊" : "🔇";
  var bs = document.querySelectorAll(".tabs button");
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-tab") === tab);
}
$("clsSel").onchange = function(){ state.current = this.value; save(); lastPicked = null; render(); };
$("sndBtn").onclick = function(){ state.sound = !state.sound; save(); renderHeader(); };
(function(){ var bs = document.querySelectorAll(".tabs button");
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){ tab = this.getAttribute("data-tab"); render(); }; })();

function render(){ if(!state) return; if(tab!=="live") lvStop(); if(tab!=="exit") exStop(); renderHeader(); if(tab==="stars") renderStars(); else if(tab==="podium") renderPodium(); else if(tab==="pick") renderPick(); else if(tab==="groups") renderGroups(); else if(tab==="att") renderAtt(); else if(tab==="hw") renderHw(); else if(tab==="live") renderLive(); else if(tab==="exit") renderExit(); else if(tab==="sheet") renderSheet(); else if(tab==="prog") renderProg(); else renderTimer(); }

function lvLoadQ(){ try{ var j = JSON.parse(localStorage.getItem(LQK) || "[]"); return Array.isArray(j) ? j : []; }catch(e){ return []; } }
function lvSaveQ(){ try{ localStorage.setItem(LQK, JSON.stringify(lv.queue)); }catch(e){ toast("تعذّر حفظ القائمة على الجهاز (الصور كبيرة). القائمة تعمل حتى إغلاق مُلهِم."); } }
// يتحقق من المسودة ويبني جسم الطلب. يرجع {err} أو {body, q}
function lvBuild(d, code){
  var opts = [], map = [];
  if(d.k === "mcq"){
    d.o.forEach(function(o, i){ if(o){ map[i] = opts.length; opts.push(o); } });
    if((!d.p && !d.img) || opts.length < 2) return {err: "اكتبي السؤال (أو أدرجي صورة) وخيارين على الأقل"};
    if(map[d.c] === undefined) return {err: "حدّدي إجابة صحيحة من الخيارات المكتوبة"};
  } else if(!d.p && !d.img) return {err: "اكتبي نص السؤال أو أدرجي صورة"};
  var body = {code: code || undefined, kind: d.k, prompt: d.p, img: d.img || undefined};
  if(d.k === "mcq"){ body.options = opts; body.correct = map[d.c]; }
  return {body: body, q: {kind: d.k, prompt: d.p, options: opts, correct: d.k === "mcq" ? map[d.c] : null, open: true}};
}
function lvSendNow(d, item){

    lv.code = j.code; lv.compose = false; b.q.id = j.id; lv.q = b.q; lv.ans = [];

}
function lvNext(){ for(var i = 0; i < lv.queue.length; i++) if(!lv.queue[i].sent) return lv.queue[i]; return null; }
function lvPending(){ return lv.queue.filter(function(x){ return !x.sent; }).length; }

function lvBlank(k){ return {p: "", o: ["", "", "", ""], c: 0, k: k || "mcq", img: ""}; }
function lvImg(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      var mx = 800, q = 0.62, out = "";
      for(var t = 0; t < 4; t++){
        var r = Math.min(1, mx / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * r)); cv.height = Math.max(1, Math.round(im.height * r));
        var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
        out = cv.toDataURL("image/jpeg", q); if(out.length <= 330000) break; mx = Math.round(mx * 0.75); q = Math.max(0.4, q - 0.08);
      }
      if(out.length > 340000){ toast("الصورة كبيرة جدًا، جرّبي صورة أصغر"); return; }
      cb(out);
    };
    im.onerror = function(){ toast("تعذّر قراءة الصورة"); };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function lvNrm(s){ return String(s || "").replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/[^؀-ۿ\w\s]/g, " ").replace(/\s+/g, " ").trim().toLowerCase(); }
function lvMatch(a, b){
  if(!a || !b) return false; if(a === b) return true;
  var A = a.split(" "), B = b.split(" "), s = A.length <= B.length ? A : B, l = A.length <= B.length ? B : A;
  return s.length >= 2 && s.every(function(t){ return l.indexOf(t) >= 0; });
}
// يحوّل اسم المجيبة إلى طالبات الفصل: اسم مجموعة ← كل أعضائها، وإلا اسم طالبة
function lvResolve(c, name){
  var n = lvNrm(name), out = [];
  ["orig", "diff"].forEach(function(k){
    var g = c.groups[k]; if(!g) return;
    g.names.forEach(function(gn, i){ if(lvNrm(gn) === n) c.students.forEach(function(s){ if(g.map[s.id] === i && out.indexOf(s.id) < 0) out.push(s.id); }); });
  });
  if(out.length) return {ids: out, group: true};
  c.students.forEach(function(s){ if(lvMatch(lvNrm(s.name), n)) out.push(s.id); });
  return {ids: out.length === 1 ? out : [], group: false, amb: out.length > 1};
}

var SH_DEF_SCALE = "0:0, 1:3, 3:4, 5:5";
function shOf(c){

  if(!Array.isArray(s.pd)) s.pd = []; if(!Array.isArray(s.hd)) s.hd = [];

  k = 0; hw.forEach(function(d){ if(d < st0 || d <= hl || s.hd.indexOf(d) >= 0) return; for(; k < 10; k++) if(!s.hd[k]){ s.hd[k] = d; k++; return; } });
}

function shTop(sc){ var t = 0; sc.forEach(function(p){ if(p[1] > t) t = p[1]; }); return t || 5; }

/* ---------- confetti ---------- */
var fx = $("fx"), ctx = fx.getContext("2d"), parts = [], fxRun = false;
function confetti(){
  fx.width = innerWidth; fx.height = innerHeight;
  var cols = ["#7c5cc4","#e5ad22","#4f9a6c","#e98aa9","#5fa8d3"];
  for(var i=0;i<90;i++) parts.push({x:fx.width/2, y:fx.height*0.45, vx:(Math.random()-.5)*14, vy:-Math.random()*12-3,
    s:Math.random()*7+4, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.3, life:110});
  if(!fxRun){ fxRun = true; requestAnimationFrame(step); }
}
function step(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(function(p){ return p.life-- > 0; });
  parts.forEach(function(p){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); });
  if(parts.length) requestAnimationFrame(step); else { fxRun = false; ctx.clearRect(0,0,fx.width,fx.height); }
}

var gKind = "orig";
function gOf(c){ return c.groups[gKind]; }
function shuffle(a){ for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function byStars(c){ return shuffle(c.students.slice()).sort(function(a, b){ return b.points - a.points; }); }
function distribute(c, kind){
  var g = c.groups[kind], list = byStars(c), n = list.length; g.map = {};
  if(kind === "orig"){ // مستويات مختلطة: توزيع ثعباني 1-2-3-4-4-3-2-1 بعد الترتيب حسب النجوم
    list.forEach(function(s, i){ var r = Math.floor(i / 4), k = i % 4; g.map[s.id] = r % 2 ? 3 - k : k; });
  } else { // التمايز: أرباع متتالية حسب النجوم (الأعلى في المجموعة الأولى)
    list.forEach(function(s, i){ g.map[s.id] = Math.min(3, Math.floor(i * 4 / n)); });
  }
  save();
}
function renderGroups(){

    (any && !g.locked ? '<button class="danger" id="gClr">مسح التوزيع</button>' : '')+'</div>';
  if(!any){
    h += '<div class="empty" style="height:auto;margin-top:2em"><div class="big">👥</div><div>'+(gKind==="orig"
      ? "وزّعي الطالبات على 4 مجموعات بمستويات مختلطة"
      : "وزّعي الطالبات على 4 مجموعات حسب المستوى")+'</div><div class="muted">'+(gKind==="orig"

      : "يرتّب المساعد الطالبات حسب نجومهن ويقسمهن إلى 4 مستويات، ثم تعدّلين ما يلزم بالضغط على اسم الطالبة.")+'</div></div>';

      (mem.length ? mem.map(function(s){ return '<span class="chip'+(absentToday(c)[s.id] ? ' absent' : '')+'" data-s="'+s.id+'">'+esc(shortName(s.name))+'<i>'+s.points+'</i></span>'; }).join("") : '<span class="muted">لا توجد طالبات</span>')+
      '</div><div class="gf"><button class="green" data-gs="'+k+'"'+(mem.length?'':' disabled')+'>⭐ نجمة للمجموعة</button></div></div>';

  if(un.length) h += '<div class="unas"><div class="muted" style="margin-bottom:.35em">بدون مجموعة ('+un.length+') — اضغطي على الاسم لإضافته:</div><div class="gm" style="display:flex;flex-wrap:wrap;gap:.35em">'+
    un.map(function(s){ return '<span class="chip'+(absentToday(c)[s.id] ? ' absent' : '')+'" data-s="'+s.id+'">'+esc(shortName(s.name))+'<i>'+s.points+'</i></span>'; }).join("")+'</div></div>';
  h += '<div class="muted" style="margin-top:.6em">'+(g.locked ? '🔒 المجموعات مثبّتة: لا يمكن نقل الطالبات أو إعادة التوزيع حتى تلغي التثبيت.' : 'اضغطي على اسم أي طالبة لنقلها إلى مجموعة أخرى، ثم اضغطي «🔓 تثبيت المجموعات» لتثبيتها.')+(gKind==="diff" ? " التوزيع حسب المستوى مبني على النجوم، فراجعيه بما تعرفينه عن طالباتك." : "")+'</div>';

/* ---------- الغياب ---------- */
var WD = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
var attDate = null, attView = "day";
function isoOf(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function dateOf(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function absentToday(c){ var o = {}, d = (c.att || {})[todayIso()] || {}; Object.keys(d).forEach(function(k){ if(d[k] === "a") o[k] = 1; }); return o; }
function dayLabel(iso){
  var d = dateOf(iso), hj = "";
  try{ hj = d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn", {day: "numeric", month: "long", year: "numeric"}); }catch(e){}
  return WD[d.getDay()] + " " + hj + "  (" + iso + ")";
}
function stepDay(c, iso, dir){
  var d = dateOf(iso);
  for(var i = 0; i < 14; i++){ d.setDate(d.getDate() + dir); if(!c.days.length || c.days.indexOf(d.getDay()) >= 0) return isoOf(d); }
  return iso;
}
function attCounts(c){
  var o = {};
  c.students.forEach(function(s){ o[s.id] = {a: 0, l: 0, x: 0, ad: [], ld: [], xd: []}; });
  Object.keys(c.att).sort().forEach(function(day){
    var rec = c.att[day];
    Object.keys(rec).forEach(function(sid){ if(!o[sid]) return; if(rec[sid] === "a"){ o[sid].a++; o[sid].ad.push(day); } else if(rec[sid] === "l"){ o[sid].l++; o[sid].ld.push(day); } else if(rec[sid] === "x"){ o[sid].x++; o[sid].xd.push(day); } });
  });
  return o;
}
function renderAtt(){
  var c = cls(); if(!c.students.length) return emptyView();
  if(!attDate) attDate = todayIso();
  var wd = dateOf(attDate).getDay(), off = c.days.length && c.days.indexOf(wd) < 0;
  var h = '<div class="gtop"><div class="seg" id="attV"><button data-v="day"'+(attView==="day"?' class="on"':'')+'>تسجيل الغياب</button><button data-v="rep"'+(attView==="rep"?' class="on"':'')+'>سجل الغياب</button></div></div>';
  if(attView === "rep") return renderAttRep(c, h);
  var rec = c.att[attDate] || {}, na = 0, nl = 0, nx = 0;
  Object.keys(rec).forEach(function(k){ if(rec[k] === "a") na++; else if(rec[k] === "l") nl++; else if(rec[k] === "x") nx++; });
  var cnt = attCounts(c);
  h += '<div class="attbar"><button id="aPrev" title="اليوم السابق">▶</button><input type="date" id="aDate" value="'+attDate+'"><button id="aNext" title="اليوم التالي">◀</button>'+
       '<button id="aToday">اليوم</button><span class="dayl">'+esc(dayLabel(attDate))+'</span></div>';
  h += '<div class="days"><span class="muted">أيام حصص هذا الفصل:</span>'+[0,1,2,3,4,5,6].map(function(d){ return '<button data-d="'+d+'"'+(c.days.indexOf(d) >= 0 ? ' class="on"' : '')+'>'+WD[d]+'</button>'; }).join("")+'</div>';
  if(off) h += '<div class="muted" style="margin:.4em 0;color:var(--red)">⚠️ هذا اليوم ليس من أيام حصص هذا الفصل، ويمكنك التسجيل فيه مع ذلك.</div>';
  h += '<div class="attsum"><span>👥 '+c.students.length+'</span><span style="color:var(--green)">✓ حاضرات '+(c.students.length - na)+'</span><span style="color:var(--red)">✗ غائبات '+na+'</span><span style="color:#b07d00">⏰ متأخرات '+nl+'</span><span style="color:#6a5acd">🚪 خروج '+nx+'</span>'+
       '<button id="aAll">✓ الكل حاضرات</button></div>';

  c.students.forEach(function(s){
    var v = rec[s.id] || "", k = cnt[s.id];
    h += '<div class="attrow '+v+'"><div class="nm">'+esc(s.name)+'<div class="cnt">غياب: '+k.a+' • تأخر: '+k.l+' • خروج: '+k.x+'</div></div>'+
         '<button data-s="'+s.id+'" data-v="a" class="'+(v==="a"?"onA":"")+'">✗ غائبة</button><button data-s="'+s.id+'" data-v="l" class="'+(v==="l"?"onL":"")+'">⏰ متأخرة</button><button data-s="'+s.id+'" data-v="x" class="'+(v==="x"?"onX":"")+'">🚪 خروج</button></div>';
  });
  h += '</div><div class="muted" style="margin-top:.5em">الطالبات حاضرات تلقائيًا؛ اضغطي «غائبة» أو «متأخرة» أو «خروج» عند الحاجة، واضغطي مرة أخرى للإلغاء. الغائبات اليوم لا يظهرن في العجلة.</div>';
  $("main").innerHTML = h; bindAttCommon(c);

  $("aPrev").onclick = function(){ attDate = stepDay(c, attDate, -1); renderAtt(); };

  for(var i = 0; i < db.length; i++) db[i].onclick = function(){
    var d = +this.getAttribute("data-d"), ix = c.days.indexOf(d);

    if(!Object.keys(r).length) delete c.att[attDate];
    save(); renderAtt();
  };
}

    var added = 0, made = 0;
    list.forEach(function(rc){
      var c = null; state.classes.forEach(function(x){ if(x.name === rc.name) c = x; });
      if(!c){ // الفصل الافتراضي الفارغ يُستبدل بدل إنشاء فصل إضافي
        if(state.classes.length === 1 && !state.classes[0].students.length && state.classes[0].name === "فصلي") c = state.classes[0];
        else { c = {id:uid(), name:rc.name, students:[], picked:[]}; state.classes.push(c); }
        c.name = rc.name; made++;
      }
      var have = {}; c.students.forEach(function(s){ have[s.name] = 1; });
      rc.students.forEach(function(n){ if(n && !have[n]){ have[n] = 1; c.students.push({id:uid(), name:n, points:0}); added++; } });
    });
    save(); fillMg(); render();
    var msg = "تم استيراد " + added + " اسمًا" + (made ? " في " + made + " فصل جديد" : "") + ". الأسماء الموجودة وأرصدتها لم تتغير.";
    lnkMsg(msg); toast(msg);
  }).catch(function(err){ lnkMsg(err.message); note(err.message || "تعذر الاستيراد"); });
}
function nrm(t){ return String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim(); }
// جلب نجوم الدروس في مُتقِن وعرضها منفصلة على بطاقة كل طالبة (لا تُضاف إلى نجوم الحصة ولا تُرسل إلى مُتقِن).
function importStars(){
  mqFetch("/api/rafeeq/stars").then(function(j){
    var map = {}, list = [];
    (j.classes || []).forEach(function(c){ (c.students || []).forEach(function(x){ list.push(x); }); });
    if(!list.length) list = j.students || [];
    list.forEach(function(x){ var k = nrm(x.name); map[k] = Math.max(map[k] || 0, +x.stars || 0); });
    var who = 0, total = 0;
    state.classes.forEach(function(c){
      c.students.forEach(function(s){
        var v = map[nrm(s.name)]; if(v === undefined) return;
        if((s.mq || 0) !== v) s.mq = v;
        if(v > 0){ who++; total += v; }
      });
    });
    save(); render();
    var msg = who ? "تم جلب نجوم مُتقِن (" + total + " نجمة لـ " + who + " طالبة) ✅" : "لا توجد نجوم لدى الطالبات في مُتقِن بعد.";
    lnkMsg(msg); toast(msg);
  }).catch(function(err){ lnkMsg(err.message); note(err.message || "تعذّر جلب النجوم"); });
}
function fillLnk(){ $("lnkTok").value = lget(TK); $("lnkAuto").checked = lget(AK) === "1"; lnkMsg(lget(TK) ? "المفتاح محفوظ على هذا الجهاز." : ""); }
$("lnkSave").onclick = function(){ var v = $("lnkTok").value.trim(); lset(TK, v); lset(LK, ""); lnkMsg(v ? "تم حفظ المفتاح على هذا الجهاز." : "حُذف المفتاح."); };
$("lnkAuto").onchange = function(){ lset(AK, this.checked ? "1" : ""); if(this.checked) scheduleSync(); };
$("lnkImp").onclick = function(){ if(!lget(TK)) $("lnkSave").onclick(); if(!lget(TK)){ lnkMsg("أدخلي مفتاح الربط أولًا."); return; } importRoster(); };
$("lnkStars").onclick = function(){ if($("lnkTok").value.trim() !== lget(TK)) $("lnkSave").onclick(); if(!lget(TK)){ lnkMsg("أدخلي مفتاح الربط أولًا."); return; } importStars(); };
$("lnkSync").onclick = function(){ if($("lnkTok").value.trim() !== lget(TK)) $("lnkSave").onclick(); doSync(true); };
})();
</script>

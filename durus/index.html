<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دروسي التفاعلية</title>
<meta name="description" content="مكتبة الدروس التفاعلية المباشرة">
<meta name="theme-color" content="#e9e1f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دروسي">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // روابط الباركود القديمة (?c=) تذهب إلى درس 3-4
  (function () { var c = new URLSearchParams(location.search).get("c"); if (c) location.replace("lessons/3-4/?c=" + encodeURIComponent(c)); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
/* Library: pastel stage, top bar (icon + name + install), search & grade chips, lesson cards grouped by chapter */
:root{
  --ink:#13213f; --ink2:#4a5677; --muted:#8a8f9e; --card:rgba(255,255,255,.94); --sand:#f3ecd9; --line:#e5dcc0;
  --teal:#17A2A6; --teal2:#6fd0cf; --blue:#2F6FD6; --pink:#E8578A; --purple:#6A4FD8; --gold:#F4C430;
  --f:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--f);color:var(--ink);
  background:radial-gradient(circle at 0 0,#ffd6e4 0 170px,transparent 171px),radial-gradient(circle at 100% 100%,#dcd2ff 0 220px,transparent 221px),radial-gradient(circle at 0 100%,#cfefe7 0 170px,transparent 171px),radial-gradient(circle at 100% 0,#ffe3c4 0 120px,transparent 121px),linear-gradient(115deg,#fdf3f7,#f3f0ff 50%,#edf8f5) fixed;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{width:64px;height:64px;border-radius:18px;box-shadow:0 6px 18px rgba(47,111,214,.25)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:900;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--ink2);font-weight:700}
.install{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:1.05rem;padding:11px 22px}
.tip{background:#fff;border-radius:18px;padding:12px 16px;font-weight:700;color:var(--ink2);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:22px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;font:inherit;font-size:1.1rem;border:2px solid var(--line);border-radius:999px;padding:11px 44px 11px 16px;background:#fffdf6;color:var(--ink)}
.search span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid transparent;border-radius:999px;background:var(--sand);padding:8px 16px;font-weight:800;font-size:1rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:18px;padding:10px 18px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.stat b{font-size:1.4rem;color:var(--blue);margin-left:6px;font-variant-numeric:tabular-nums}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.store{border:3px solid transparent;border-radius:26px;padding:18px 20px;text-align:right;display:flex;align-items:center;gap:16px;color:#fff;box-shadow:0 10px 26px rgba(19,33,63,.12);transition:transform .15s}
.store:hover{transform:translateY(-2px)}
.store.g1{background:linear-gradient(135deg,#5b8ef0,#2F6FD6)}
.store.g3{background:linear-gradient(135deg,#9a7cf0,#6A4FD8)}
.store[aria-pressed="true"]{border-color:#fff;outline:3px solid var(--gold);outline-offset:0}
.store[aria-pressed="false"]{opacity:.78}
.store .ic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2rem;flex:none}
.store .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.store small{font-weight:700;opacity:.9}
.store strong{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:900}
.store .cnt{margin-inline-start:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-weight:900;font-size:1.1rem;white-space:nowrap}
@media (max-width:560px){.stores{grid-template-columns:minmax(0,1fr)}}
.group h2{margin:6px 4px 10px;font-size:1.3rem;font-weight:900;display:flex;align-items:center;gap:10px}
.group h2 small{font-size:.95rem;color:var(--ink2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(19,33,63,.07);text-decoration:none;color:inherit;border:2px solid transparent;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:#cfe0fb}
.c-top{display:flex;align-items:center;gap:12px}
.num{flex:none;background:var(--blue);color:#fff;font-weight:900;font-size:1.5rem;border-radius:16px;padding:6px 14px;direction:ltr}
.c-top h3{margin:0;font-size:1.25rem;font-weight:900;line-height:1.35;text-wrap:balance}
.en{color:var(--muted);font-size:.9rem;direction:ltr;text-align:left}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{background:var(--sand);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.feat{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;font-weight:700;color:var(--teal)}
.open{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:linear-gradient(180deg,var(--teal2),var(--teal));color:#fff;font-weight:800;font-size:1.05rem;padding:11px}
.empty{background:var(--card);border-radius:24px;padding:34px;text-align:center;font-weight:700;color:var(--ink2)}
.add{border:2px dashed #cdbff3;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:6px;color:var(--ink2);background:rgba(255,255,255,.55)}
.add b{color:var(--purple);font-size:1.1rem}
footer{text-align:center;color:var(--ink2);font-weight:700;font-size:.95rem}
@media (max-width:560px){.top img{width:52px;height:52px}.install{width:100%}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="icons/icon-192.png" alt="">
    <div class="brand"><h1>دروسي التفاعلية</h1><p>دروس مباشرة تدخلها الطالبات بالباركود وتُعرض إجاباتهن على الشاشة</p></div>
    <button class="install" id="install" hidden>⬇ تثبيت التطبيق</button>
  </header>
  <div class="tip" id="iosTip" hidden>لتثبيت التطبيق على الآيباد أو الآيفون: اضغطي زر المشاركة ⬆ في Safari، ثم «إضافة إلى الشاشة الرئيسية».</div>

  <nav class="stores" id="stores" aria-label="مخازن الدروس"></nav>

  <div class="bar">
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="ابحثي عن درس بالاسم أو الرقم" aria-label="البحث في الدروس"></label>
  </div>
  <main id="list"><div class="empty">جارٍ تحميل الدروس…</div></main>
  <footer>إعداد المعلمة: عهود جويهر</footer>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STORES = [
    { id: "first", grade: "الأول الثانوي", label: "مخزن الصف الأول الثانوي", cls: "g1", ic: "📘" },
    { id: "third", grade: "الثالث الثانوي", label: "مخزن الصف الثالث الثانوي", cls: "g3", ic: "📗" },
  ];
  let lessons = [];
  const saved = (() => { try { return localStorage.getItem("durus-store"); } catch (e) { return null; } })();
  let store = STORES.find((x) => "#" + x.id === location.hash) || STORES.find((x) => x.id === saved) || STORES[0];

  function stores() {
    $("#stores").innerHTML = STORES.map((x) => { const n = lessons.filter((l) => l.grade === x.grade).length;
      return `<button class="store ${x.cls}" aria-pressed="${x === store}" data-id="${x.id}"><span class="ic" aria-hidden="true">${x.ic}</span><span class="tx"><small>مخزن</small><strong>${esc(x.label.replace("مخزن ", ""))}</strong></span><span class="cnt">${n} ${n === 1 ? "درس" : "دروس"}</span></button>`; }).join("");
    document.querySelectorAll(".store").forEach((b) => b.addEventListener("click", () => { store = STORES.find((x) => x.id === b.dataset.id);
      try { localStorage.setItem("durus-store", store.id); history.replaceState(null, "", "#" + store.id); } catch (e) {} stores(); render(); }));
  }
  function render() {
    const q = $("#q").value.trim();
    const inStore = lessons.filter((l) => l.grade === store.grade);
    const items = inStore.filter((l) => !q || (l.title + " " + l.num + " " + l.chapter).includes(q));
    if (!inStore.length) { $("#list").innerHTML = `<div class="grid">${addCard(true)}</div>`; return; }
    if (!items.length) { $("#list").innerHTML = `<div class="empty">لا توجد دروس مطابقة للبحث في ${esc(store.label)}.</div>`; return; }
    const groups = {}; items.forEach((l) => { (groups[l.chapter] = groups[l.chapter] || []).push(l); });
    $("#list").innerHTML = Object.entries(groups).map(([ch, ls]) =>
      `<section class="group"><h2>${esc(ch)} <small>${ls.length} ${ls.length === 1 ? "درس" : "دروس"}</small></h2><div class="grid">${ls.sort((a, b) => a.num.localeCompare(b.num, "en", { numeric: true })).map(card).join("")}</div></section>`).join("")
      + `<div class="grid" style="margin-top:16px">${addCard(false)}</div>`;
  }
  const card = (l) => `<a class="card" href="${esc(l.path)}">
      <div class="c-top"><span class="num">${esc(l.num)}</span><h3>${esc(l.title)}</h3></div>
      ${l.en ? `<div class="en">${esc(l.en)}</div>` : ""}
      <div class="meta"><span>${esc(l.grade)}</span><span>${esc(l.slides)} شريحة</span></div>
      <div class="feat"><span>● باركود للطالبات</span><span>● نتائج مباشرة</span><span>● الأكثر تفاعلًا</span></div>
      <span class="open">فتح الدرس ←</span></a>`;
  const addCard = (first) => `<div class="add"><b>＋ ${first ? "أول درس في هذا المخزن" : "درس جديد"}</b><span>أرسلي صفحات الدرس في محادثة Claude، وسيُضاف إلى ${esc(store.label)} تلقائيًا.</span></div>`;

  fetch("lessons.json", { cache: "no-cache" }).then((r) => r.json()).then((d) => { lessons = d; stores(); render(); })
    .catch(() => { $("#list").innerHTML = `<div class="empty">تعذّر تحميل قائمة الدروس. تأكدي من الاتصال بالإنترنت ثم حدّثي الصفحة.</div>`; });
  $("#q").addEventListener("input", render);

  // install
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("#install").hidden = false; });
  $("#install").addEventListener("click", async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("#install").hidden = true; });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) $("#iosTip").hidden = !!standalone;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
